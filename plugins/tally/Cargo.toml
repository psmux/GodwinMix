# A first party service plugin, and a member of the repository's workspace
# through the `plugins/*` glob in the root manifest.
[package]
name = "gmx-tally"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "TSL UMD v5 tally for GodwinMix: one lamp per source, over UDP or TCP"
license = "Apache-2.0"
repository = "https://github.com/psmux/godwinmix"

[[bin]]
name = "gmx-tally"
path = "src/main.rs"

[lib]
name = "gmx_tally"
path = "src/lib.rs"

[dependencies]
godwinmix-sdk = { path = "../../crates/godwinmix-sdk" }
godwinmix-client = { path = "../../crates/godwinmix-client" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

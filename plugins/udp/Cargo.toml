[package]
name = "gmx-udp"
description = "The udp/source and udp/output plugin: MPEG-TS over UDP and RTP, unicast and multicast, with program selection, loss counting and a constant bitrate mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gmx-udp"
path = "src/main.rs"

# The receive and send halves as a library, for the direct host in
# plugins/ingest. Its docs are off so they do not collide with the binary's.
[lib]
name = "gmx_udp"
path = "src/lib.rs"
doc = false

[dependencies]
godwinmix-sdk = { path = "../../crates/godwinmix-sdk" }
gmx-netkit = { path = "../netkit" }
# For the programme FIFO an output reads: opened without waiting for the core,
# and pumped into an appsrc because poll on a FIFO lies on macOS.
godwinmix-capture-common = { path = "../capture-common" }

gstreamer = { workspace = true }
serde_json = { workspace = true }

# getifaddrs and setsockopt, for the interface multicast leaves by. See src/iface.rs.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The stand in core and the lossy sender, for measuring by hand. Their own
# tests run with the rest, so `cargo test -p gmx-udp` keeps them working.
[[example]]
name = "drive"
test = true

[[example]]
name = "lossy_send"
test = true

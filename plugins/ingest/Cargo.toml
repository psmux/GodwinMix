[package]
name = "gmx-ingest"
description = "The ingest plugin: GodwinMix as a server. An RTMP listener in pure Rust, WHIP ingest, and a device provide that reports who is publishing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gmx-ingest"
path = "src/main.rs"

[dependencies]
godwinmix-sdk = { path = "../../crates/godwinmix-sdk" }
gmx-netkit = { path = "../netkit" }
# The udp plugin's TS parsing, program choice and loss counting, for a direct
# show's multicast, SRT and RIST inputs (src/direct/input/). Its library half.
gmx-udp = { path = "../udp" }

gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
glib = { workspace = true }
serde_json = { workspace = true }

# The RTMP protocol, sans-io: it parses chunks and raises events and never
# touches a socket. About 6,000 lines of library code, MIT, and it brings
# byteorder, rml_amf0 and a second copy of the sha2/hmac stack for the Flash
# Player 9 handshake. Eight small pure Rust crates and no C, against a 30 MB Go
# binary and a second supervised process for the mediamtx alternative. The
# reasoning is written out at the top of src/rtmp.rs.
rml_rtmp = "0.8.0"

# The restreamer (src/restream/). None of these is new to the build: the
# protocol crate is under the SDK already, `bytes` and `rml_amf0` are under
# rml_rtmp, and rustls with the ring provider and the Mozilla roots is what the
# core's node bridge and reqwest compile. Named here because the client
# session takes `Bytes`, metadata has to be read out of AMF0, and Facebook
# takes nothing but RTMPS.
godwinmix-protocol = { workspace = true }
bytes = "1.9"
rml_amf0 = "0.3.0"
rustls = { workspace = true }
webpki-roots = "1"

# SRT on one port for every channel (src/srt.rs). libsrt is loaded at run
# time, not linked, so building this plugin needs no SRT headers; libloading
# is already in the tree under wasmtime. src/srt.rs says why GStreamer's own
# srtsrc cannot tell two callers on one port apart.
libloading = "0.8"

# WHIP on the control port (src/whip.rs): webrtcbin needs its session
# descriptions as the typed GstWebRTCSessionDescription, which only these
# bindings make. They link libgstwebrtc and libgstsdp, which come with
# GStreamer's bad and base plugin sets. Behind the `webrtc` feature so a build
# for RTMP and SRT alone can leave them out: `--no-default-features`.
gstreamer-webrtc = { version = "0.24", optional = true }
gstreamer-sdp = { version = "0.24", optional = true }

[features]
default = ["webrtc"]
webrtc = ["dep:gstreamer-webrtc", "dep:gstreamer-sdp"]

[dev-dependencies]
# A self signed certificate for the RTMPS test; already in the tree under the
# core's node certificate authority.
rcgen = { workspace = true }
# A camera for the direct show's RTSP input test (src/direct/input/tests/),
# already built for plugins/rtsp, so nothing new is compiled.
gstreamer-rtsp-server = "0.24"

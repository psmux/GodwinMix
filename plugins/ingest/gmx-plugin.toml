# ingest: GodwinMix as a server.
#
# Everywhere else the mixer dials out. Here it waits, and a phone, an OBS on the
# other laptop, a hardware encoder in the rack or a guest in a browser dials in.
#
# ingest/discover is the channel server: the core runs it as a singleton, hands
# it the channel table under `channels` in its settings, and reads its
# event/channel.* notifications. It takes RTMP, RTMPS, SRT and WHIP (handed
# over from the core's control port), one port per protocol for every channel,
# and opens each only while a channel uses it. docs/reference/channels.md is
# the core's side. `srt/source` is still the way to take one SRT feed with no
# channel. The RTSP server is not here, and
# docs/how-to/receive-a-phone-or-obs-stream.md says what it would cost.

[plugin]
name = "ingest"
version = "0.1.0"
api = 1
description = "GodwinMix as a server: channels an OBS, a phone, a hardware encoder or a browser publish to by RTMP, RTMPS, SRT or WHIP, one port per protocol for every channel and none open until a channel needs it, and a standalone RTMP listener and WHIP endpoint for one publisher each."
license = "Apache-2.0"
authors = ["GodwinMix"]
repository = "https://github.com/psmux/godwinmix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["sidecar", "node"]
process = "per-instance"

[run]
bin = { "linux-x86_64" = "bin/gmx-ingest", "linux-aarch64" = "bin/gmx-ingest", "macos-aarch64" = "bin/gmx-ingest", "macos-x86_64" = "bin/gmx-ingest", "windows-x86_64" = "bin/gmx-ingest.exe" }

[[provides]]
kind = "source"
id = "rtmp"
# No uri_schemes: rtmp:// belongs to the built in rtmp/source, which dials out.
# This one listens, and there is no URL that means "listen here".
media = { video = "container", audio = "container", alpha = false, thumb = true }
transports = ["container"]
capabilities = ["restart-in-place", "health"]
latency_ms = 0
settings = "schemas/rtmp.json"
skill = "skills/rtmp/SKILL.md"

[provides.designer]
icon = "designer/icon.svg"

[[provides]]
kind = "source"
id = "whip"
media = { video = "container", audio = "container", alpha = false, thumb = true }
transports = ["container"]
capabilities = ["restart-in-place", "health", "latency-report"]
latency_ms = 100
settings = "schemas/whip.json"
skill = "skills/whip/SKILL.md"

[[provides]]
kind = "device"
id = "discover"
# RTMP publishers announce themselves by connecting, so there is nothing to
# browse for: the listener is the discovery. The key is declared because the
# manifest requires one and because a later mDNS announcement of the ingest
# address would go here.
discovery = { mdns = ["_rtmp._tcp"] }
settings = "schemas/discover.json"
skill = "skills/discover/SKILL.md"

[[tools]]
name = "add_publishers"
description = "Make the mixer's sources match whoever is publishing RTMP to it right now: add an ingest/rtmp source for each new publisher and remove the ones this tool added whose publisher has gone. Use after a guest connects, or on a timer, when the operator wants publishers to appear by themselves. Example: add_publishers {\"dry_run\": true} answers {add: [\"live-phone\"], remove: [], publishers: [\"live-phone\"]} and changes nothing."
input = "schemas/tools/add_publishers.json"
output = "schemas/tools/add_publishers.out.json"
annotations = { readOnlyHint = false, destructiveHint = false, idempotentHint = true, openWorldHint = true }
user_invocable = true
model_invocable = true

[[tools]]
name = "streams"
description = "Every stream live on the mixer's RTMP port right now, by channel: who is publishing it and from where, which key let it in, its video codec, size, frame rate and bit rate, its audio codec, channels, sample rate and bit rate, how many readers it has and how many whole GOPs a slow reader has lost. Reads numbers the listener keeps anyway; changes nothing. Example: streams {} answers {port: 1935, streams: [{app: sunday-service, stream: main, video: {codec: h264, width: 1920, height: 1080, fps: 30, kbps: 5980}, ...}]}."
input = "schemas/tools/streams.json"
output = "schemas/tools/streams.out.json"
annotations = { readOnlyHint = true, destructiveHint = false, idempotentHint = true, openWorldHint = false }
user_invocable = true
model_invocable = true

# `gmx plugin add ./plugins/ingest` runs this when bin/gmx-ingest is not there.
# The command runs in the directory you named, not in the installed copy:
# this plugin is a workspace member and its dependencies are path
# dependencies two levels up, so the copy is not a tree cargo can build.
[build]
command = "sh build"
output = "bin/gmx-ingest"

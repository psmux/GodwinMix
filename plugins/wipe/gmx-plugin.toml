# A transition plugin: no media at all, one method, called once per frame of
# the transition before it starts.
[plugin]
name = "wipe"
version = "0.2.0"
api = 1
description = "A wipe: the incoming scene slides in over the outgoing one, from any edge."
license = "Apache-2.0"
authors = ["GodwinMix"]
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["sidecar"]
process = "singleton"

[run]
bin = { "linux-x86_64" = "bin/gmx-wipe", "linux-aarch64" = "bin/gmx-wipe", "macos-aarch64" = "bin/gmx-wipe", "macos-x86_64" = "bin/gmx-wipe", "windows-x86_64" = "bin/gmx-wipe.exe" }

[[provides]]
kind = "transition"
id = "wipe"
capabilities = ["health"]
settings = "schemas/wipe.json"

# `gmx plugin add ./plugins/wipe` runs this when bin/gmx-wipe is not there.
# The command runs in the directory you named, not in the installed copy:
# this plugin is a workspace member and its dependencies are path
# dependencies two levels up, so the copy is not a tree cargo can build.
[build]
command = "sh build"
output = "bin/gmx-wipe"

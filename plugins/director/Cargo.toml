# A first party service plugin, and a member of the repository's workspace
# through the `plugins/*` glob in the root manifest.
[package]
name = "gmx-director"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "An automatic director for GodwinMix: rule based out of the box, and able to consult a model when one is configured"
license = "Apache-2.0"
repository = "https://github.com/psmux/godwinmix"

[[bin]]
name = "gmx-director"
path = "src/main.rs"

[lib]
name = "gmx_director"
path = "src/lib.rs"

[dependencies]
godwinmix-sdk = { path = "../../crates/godwinmix-sdk" }
godwinmix-client = { path = "../../crates/godwinmix-client" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "process", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process", "io-util"] }

[package]
name = "gmx-ipcam"
description = "The ipcam plugin: an IP camera's MJPEG stream or snapshot picture as a source, and ONVIF discovery of the cameras on the LAN as ready to add RTSP streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gmx-ipcam"
path = "src/main.rs"

[dependencies]
godwinmix-sdk = { path = "../../crates/godwinmix-sdk" }
gmx-netkit = { path = "../netkit" }
# The ONVIF envelope, login and HTTP call, shared with the PTZ drivers.
godwinmix-ptz = { path = "../../crates/godwinmix-ptz" }

gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
serde_json = { workspace = true }
# The tests' fake cameras read logins in base64.
base64 = { workspace = true }

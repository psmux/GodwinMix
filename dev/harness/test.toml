# Local test rig. Everything on loopback, RTMP served by mediamtx on 1935.
[canvas]
width = 1280
height = 720
fps = 30
sample_rate = 48000
channels = 2

[program]
video_bitrate_kbps = 6000
audio_bitrate_kbps = 160
keyframe_interval_secs = 2
audio_ramp_ms = 180

[multiview]
enabled = true
width = 960
height = 540
fps = 8
jpeg_quality = 60
include_program = true

[security]
allow_exec_sources = true

[media]
dir = "media"

[control]
bind = "127.0.0.1:8080"

[hardware]
decode = "auto"
encode = "auto"

[[sources]]
id = "cam1"
name = "Camera 1"
uri = "rtmp://127.0.0.1:1935/live/cam1"

[[outputs]]
id = "primary"
uri = "rtmp://127.0.0.1:1935/live/program"

# No sidecar path, so `web+` looks next to the binary and then on PATH, and
# falls back to wpesrc when it finds neither. Point it at your own build if you
# have one; do not commit a path from your machine back into this file.
#
# [browser]
# sidecar = "../../browser/dev/sidecar-docker.sh"
# env = { GMX_SIDECAR_LOG = "logs/sidecar.log" }

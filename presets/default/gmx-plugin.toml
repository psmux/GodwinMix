[plugin]
name = "default"
version = "1.0.0"
api = 1
description = "Two RTMP cameras in, one RTMP destination out, a media library and the multiview. What GodwinMix does out of the box."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "default"

[provides.preset]
plugins = ["rtmp@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "dark"
scenes = "scenes"
gallery = "live"

# What the person does next, as data rather than as sentences. The welcome
# panel draws a control for each one. `docs/reference/presets.md` is the schema.
[[provides.preset.next]]
action = "add_source"
kind = "rtmp/source"
text = "Point your camera or phone encoder at this mixer, or drop a video file on the page."

[[provides.preset.next]]
action = "take"
source = "cam1"
text = "Press a tile to put it on air. The picture at the top is what your audience sees."

[[provides.preset.next]]
action = "note"
text = "The destination starts pointed at this machine. Destinations, then Edit, sends it somewhere else."

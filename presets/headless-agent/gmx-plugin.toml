[plugin]
name = "headless-agent"
version = "1.0.0"
api = 1
description = "No screen: the mixer runs on a server, an agent directs it over MCP, and the only surface is the API."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "headless-agent"

[provides.preset]
plugins = ["browser@^1", "rtmp@^1", "director@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "none"
theme = "dark"
scenes = "scenes"
gallery = "label"

# What the operator does next. This preset has no screen, so nothing here
# draws a control; it is read through `preset.list`.
# `docs/reference/presets.md` is the schema.
[[provides.preset.next]]
do = "note"
text = "Nobody sits at this mixer. An agent drives it over the protocol, and the mixer describes every method it has."

[[provides.preset.next]]
do = "note"
text = "Give the agent the control token this mixer was started with. Without one it answers nothing."

[[provides.preset.next]]
do = "take"
source = "page"
text = "The channel page goes on air first, and standby covers the gap when it is not ready."

[plugin]
name = "headless-agent"
version = "1.0.0"
api = 1
description = "No screen: the mixer runs on a server, an agent directs it over MCP, and the only surface is the API."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "headless-agent"

[provides.preset]
plugins = ["browser@^1", "rtmp@^1", "director@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "none"
theme = "dark"
scenes = "scenes"
gallery = "label"

# The things the person does next, in order. Each one says what it does and
# to what, so the welcome dialog in the web UI draws it as a button and ticks
# it off when it is done. The text is what the CLI prints, and what a page that
# does not know `does` shows. None of them names a file or a command: the
# person reading them is already in the mixer.

[[provides.preset.steps]]
text = "Add the stream key for wherever the channel goes."
does = "add-key"
target = "primary"

[[provides.preset.steps]]
text = "Install the director plugin, the agent that runs the channel."
does = "install-plugin"
target = "director"

[[provides.preset.steps]]
text = "Watch Alerts while the agent takes its first source. Every switch it makes shows up there."
does = "open-panel"
target = "core/alerts"

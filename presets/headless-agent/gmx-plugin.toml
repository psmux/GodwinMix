[plugin]
name = "headless-agent"
version = "1.0.0"
api = 1
description = "No screen: the mixer runs on a server, an agent directs it over MCP, and the only surface is the API."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "headless-agent"

[provides.preset]
plugins = ["browser@^1", "rtmp@^1", "director@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "none"
theme = "dark"
scenes = "scenes"
gallery = "label"

# The three things the person does next. The welcome panel in the web UI
# shows these in this order, and the README repeats them.
steps = [
  "Put your destination's URL and stream key into the [[outputs]] block.",
  "Run `gmx`, then point your agent at it with `gmx mcp --url http://localhost:8080`.",
  "Ask the agent for `get_state`, then `take` a source, and watch `gmx ctl status`.",
]

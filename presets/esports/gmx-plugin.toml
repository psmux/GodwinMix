[plugin]
name = "esports"
version = "1.0.0"
api = 1
description = "A match: four player feeds on a node, the caster's camera, an overlay from a page, replays, and one destination."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "esports"

[provides.preset]
plugins = ["ndi@^1", "browser@^1", "rtmp@^1", "screen@^1", "replay@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "neon"
scenes = "scenes"
theme_css = "theme.css"
gallery = "live"

# The things the person does next, in order. Each one says what it does and
# to what, so the welcome dialog in the web UI draws it as a button and ticks
# it off when it is done. The text is what the CLI prints, and what a page that
# does not know `does` shows. None of them names a file or a command: the
# person reading them is already in the mixer.

[[provides.preset.steps]]
text = "Add the player feeds and the caster camera from the streams on your network."
does = "add-source"
target = "streams"

[[provides.preset.steps]]
text = "Add the Twitch stream key."
does = "add-key"
target = "twitch"

[[provides.preset.steps]]
text = "Press Quad to bring all four players up."
does = "take"
target = "quad"

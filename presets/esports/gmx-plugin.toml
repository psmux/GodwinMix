[plugin]
name = "esports"
version = "1.0.0"
api = 1
description = "A match: four player feeds on a node, the caster's camera, an overlay from a page, replays, and one destination."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "esports"

[provides.preset]
plugins = ["ndi@^1", "browser@^1", "rtmp@^1", "screen@^1", "replay@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "neon"
scenes = "scenes"
theme_css = "theme.css"
gallery = "live"

# The three things the person does next. The welcome panel in the web UI
# shows these in this order, and the README repeats them.
steps = [
  "Put the four player feeds and the caster camera into the [[sources]] blocks.",
  "Put your destination's URL and stream key into the [[outputs]] block.",
  "Run `gmx`, open http://localhost:8080, and press Quad to bring all four up.",
]

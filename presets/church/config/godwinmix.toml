# The church preset: a Sunday service with two cameras, lyrics and slides,
# going to YouTube and Facebook at the same time.
#
# Everything a volunteer has to change is in the first thirty lines.
#
# The two cameras are placeholders you can put on air today: they show a test
# pattern so the picture moves and the stream is real while you set the rest
# up. The page offers to install the camera plugin, and then lists the cameras
# this machine can see, so nothing in this file has to be typed by hand.

[canvas]
width = 1920
height = 1080
fps = 30
sample_rate = 48000
channels = 2

[program]
video_bitrate_kbps = 4500
audio_bitrate_kbps = 160
keyframe_interval_secs = 2
# A service has music in it. A short ramp keeps a take from clicking.
audio_ramp_ms = 250

[multiview]
enabled = true
width = 960
height = 540
fps = 8
jpeg_quality = 60
include_program = true

# The gallery starts on icons for this preset, so the tiles cost nothing and
# the machine at the back of the hall has its cores for the encoder. Snapshots
# are what the tiles fall back to when somebody wants a look.
[snapshot]
enabled = true
default_width = 320
min_interval_secs = 5
max_width = 1280
idle_secs = 15

[media]
dir = "media"

[control]
bind = "0.0.0.0:8080"
# Set this before the machine is on a network anybody else is on.
# token = "change-me"

[hardware]
decode = "auto"
encode = "auto"

# The two cameras. Until the camera plugin is installed these are test
# patterns, which means the service can go out today and the cameras can be
# sorted out next week.
[[sources]]
id = "cam-wide"
name = "Wide"
type = "test/source"
uri = "test://smpte"
params = { uri = "test://smpte" }

[[sources]]
id = "cam-pulpit"
name = "Pulpit"
type = "test/source"
uri = "test://ball"
params = { uri = "test://ball" }

# The lyrics page. Any presentation program with a web output works here:
# point this at its address. A transparent background is what makes the words
# sit over the picture rather than replace it.
[[sources]]
id = "lyrics"
name = "Lyrics"
type = "browser/source"
uri = "web+http://127.0.0.1:8000/lyrics"
params = { url = "http://127.0.0.1:8000/lyrics", superimpose = "auto" }

# The slides. A file on this machine, in the media directory above. Drop a new
# one onto the page on a Saturday and it is there on Sunday.
[[sources]]
id = "slides"
name = "Slides"
type = "file/source"
uri = "media/slides.mp4"
params = { uri = "media/slides.mp4" }

[[outputs]]
id = "youtube"
type = "rtmp/output"
uri = "rtmp://a.rtmp.youtube.com/live2/YOUR-STREAM-KEY"
policy = "cdn"
queue_secs = 6.0

[[outputs]]
id = "facebook"
type = "rtmp/output"
uri = "rtmps://live-api-s.facebook.com:443/rtmp/YOUR-STREAM-KEY"
policy = "cdn"
queue_secs = 6.0

[plugin]
name = "church"
version = "1.0.0"
api = 1
description = "Sunday service: two cameras, lyrics from a browser page, slides from a file, and YouTube and Facebook at once. The cameras start as test patterns so the service can go out before the camera plugin is installed."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "church"

[provides.preset]
plugins = ["camera@^1", "browser@^1", "rtmp@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "calm"
scenes = "scenes"
theme_css = "theme.css"
gallery = "icon"

# What the volunteer does next, as data rather than as sentences. The welcome
# panel draws a control for each one: a box and a Save for a stream key, the
# Install button for a plugin. `docs/reference/presets.md` is the schema.
[[provides.preset.next]]
action = "stream_key"
output = "youtube"
text = "YouTube Studio, then Create, then Go Live, shows the key beside the stream URL."

[[provides.preset.next]]
action = "stream_key"
output = "facebook"
text = "The Live producer page shows it. Leave it if the service only goes to YouTube."

[[provides.preset.next]]
action = "install_plugin"
name = "camera"
text = "The two cameras are test patterns until this is here, so the service can go out before they are."

[[provides.preset.next]]
action = "take"
source = "cam-wide"
text = "Press Wide to put a picture on air, then the red button when the service starts."

[plugin]
name = "church"
version = "1.0.0"
api = 1
description = "Sunday service: two NDI cameras, lyrics from a browser page, slides, YouTube and Facebook at once, and a four button surface for the volunteer."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "church"

[provides.preset]
plugins = ["camera@^1", "browser@^1", "rtmp@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "calm"
scenes = "scenes"
theme_css = "theme.css"
gallery = "icon"

# The three things the person does next. The welcome panel in the web UI
# shows these in this order, and the README repeats them.
steps = [
  "Run `gmx ctl device list` and put your two cameras' names into the [[sources]] blocks.",
  "Put your YouTube and Facebook stream keys into the two [[outputs]] blocks.",
  "Run `gmx`, open http://localhost:8080 on the volunteer's screen, and press Wide.",
]

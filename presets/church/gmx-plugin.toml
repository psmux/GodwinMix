[plugin]
name = "church"
version = "1.0.0"
api = 1
description = "Sunday service: two cameras, lyrics from a browser page, slides from a file, and YouTube and Facebook at once. The cameras start as test patterns so the service can go out before the camera plugin is installed."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "church"

[provides.preset]
plugins = ["camera@^1", "browser@^1", "rtmp@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "calm"
scenes = "scenes"
theme_css = "theme.css"
gallery = "icon"

# The things the person does next, in order. Each one says what it does and
# to what, so the welcome dialog in the web UI draws it as a button and ticks
# it off when it is done. The text is what the CLI prints, and what a page that
# does not know `does` shows. None of them names a file or a command: the
# person reading them is already in the mixer.

[[provides.preset.steps]]
text = "Add the YouTube stream key."
does = "add-key"
target = "youtube"

[[provides.preset.steps]]
text = "Add the Facebook stream key."
does = "add-key"
target = "facebook"

[[provides.preset.steps]]
text = "Press Wide to put a picture on air, then press the red button when the service starts."
does = "take"
target = "cam-wide"

[plugin]
name = "church"
version = "1.0.0"
api = 1
description = "Sunday service: two cameras, lyrics from a browser page, slides from a file, and YouTube and Facebook at once. The cameras start as test patterns so the service can go out before the camera plugin is installed."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "church"

[provides.preset]
plugins = ["camera@^1", "browser@^1", "rtmp@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "calm"
scenes = "scenes"
theme_css = "theme.css"
gallery = "icon"

# The three things the person does next. The welcome panel in the web UI
# shows these in this order, and the README repeats them.
steps = [
  "Put your YouTube and Facebook stream keys into the two [[outputs]] blocks of godwinmix.toml.",
  "Run `gmx` and open http://localhost:8080 on the volunteer's screen.",
  "Press Wide to put a picture on air, then press the red button when the service starts.",
]

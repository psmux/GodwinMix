[plugin]
name = "broadcast"
version = "1.0.0"
api = 1
description = "A contribution feed: SRT in and SRT out, hardware tally over TSL, a Companion surface, and nodes joined with mTLS."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "broadcast"

[provides.preset]
plugins = ["srt@^1", "ndi@^1", "tally@^1", "companion@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "broadcast"
scenes = "scenes"
theme_css = "theme.css"
gallery = "live"

# What the engineer does next, as data rather than as sentences. The welcome
# panel draws a control for each one. `docs/reference/presets.md` is the schema.
[[provides.preset.next]]
do = "install_plugin"
name = "srt"
text = "Both venue feeds and the network output are SRT, so nothing connects until this is here."

[[provides.preset.next]]
do = "note"
text = "The venues connect on their own as soon as their encoders start. The Sources panel says which have arrived."

[[provides.preset.next]]
do = "take"
source = "studio"
text = "Press Studio to go on air, then cut to a venue when its feed is green."

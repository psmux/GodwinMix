[plugin]
name = "broadcast"
version = "1.0.0"
api = 1
description = "A contribution feed: SRT in and SRT out, hardware tally over TSL, a Companion surface, and nodes joined with mTLS."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "broadcast"

[provides.preset]
plugins = ["srt@^1", "ndi@^1", "tally@^1", "companion@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "broadcast"
scenes = "scenes"
theme_css = "theme.css"
gallery = "live"

# The things the person does next, in order. Each one says what it does and
# to what, so the welcome dialog in the web UI draws it as a button and ticks
# it off when it is done. The text is what the CLI prints, and what a page that
# does not know `does` shows. None of them names a file or a command: the
# person reading them is already in the mixer.

[[provides.preset.steps]]
text = "Check the two venue feeds in Sources. Each tile comes alive when its venue starts sending."
does = "open-panel"
target = "core/sources"

[[provides.preset.steps]]
text = "Set the network's SRT destination and passphrase."
does = "add-key"
target = "network"

[[provides.preset.steps]]
text = "Look at Alerts before the first feed. It names anything that is missing."
does = "open-panel"
target = "core/alerts"

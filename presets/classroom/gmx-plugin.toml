[plugin]
name = "classroom"
version = "1.0.0"
api = 1
description = "A lesson recorded and streamed: a camera on the teacher, the screen beside it, the slides from a file, a recording and one destination."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "classroom"

[provides.preset]
plugins = ["camera@^1", "screen@^1", "rtmp@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "daylight"
scenes = "scenes"
theme_css = "theme.css"
gallery = "snapshot"

# What the teacher does next, as data rather than as sentences. The welcome
# panel draws a control for each one. `docs/reference/presets.md` is the schema.
[[provides.preset.next]]
do = "install_plugin"
name = "camera"
text = "The camera is a test pattern until this is here, so the lesson records before the room is sorted out."

[[provides.preset.next]]
do = "install_plugin"
name = "screen"
text = "The same for the shared screen."

[[provides.preset.next]]
do = "take"
source = "teacher"
text = "Press Teacher to put a picture on air, then Split to show the screen beside it."

[[provides.preset.next]]
do = "note"
text = "The recording and the stream both go to this machine. Destinations, then Edit, sends either one elsewhere."

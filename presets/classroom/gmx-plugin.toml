[plugin]
name = "classroom"
version = "1.0.0"
api = 1
description = "A lesson recorded and streamed: a camera on the teacher, the screen beside it, the slides from a file, a recording and one destination."
license = "Apache-2.0"
authors = ["The GodwinMix authors"]
repository = "https://github.com/psmux/GodwinMix"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
placements = ["core"]

[[provides]]
kind = "preset"
id = "classroom"

[provides.preset]
plugins = ["camera@^1", "screen@^1", "rtmp@^1"]
config = "config/godwinmix.toml"
layout = "config/layout.json"
surface = "web"
theme = "daylight"
scenes = "scenes"
theme_css = "theme.css"
gallery = "snapshot"

# The things the person does next, in order. Each one says what it does and
# to what, so the welcome dialog in the web UI draws it as a button and ticks
# it off when it is done. The text is what the CLI prints, and what a page that
# does not know `does` shows. None of them names a file or a command: the
# person reading them is already in the mixer.

[[provides.preset.steps]]
text = "Add the webcam that points at the teacher. Until then the Teacher tile is a test pattern."
does = "add-source"
target = "cameras"

[[provides.preset.steps]]
text = "Add your school's stream key, or leave it and only record."
does = "add-key"
target = "stream"

[[provides.preset.steps]]
text = "Press Teacher to start the lesson."
does = "take"
target = "teacher"

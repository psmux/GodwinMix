# The classroom preset: a camera on the teacher, the teacher's screen beside
# it, recorded to this machine and streamed to one address.
#
# The camera and the screen are placeholders you can put on air today: they
# show a test pattern, so the lesson can be recorded while the room's hardware
# is sorted out. The page offers to install the camera and screen plugins, and
# them; change `type` and put the device in `params`, and nothing else moves.

[canvas]
width = 1280
height = 720
fps = 25
sample_rate = 48000
channels = 2

[program]
# 720p25 is enough for a lesson and it runs on the laptop that is already in
# the room.
video_bitrate_kbps = 2500
audio_bitrate_kbps = 128
keyframe_interval_secs = 2
audio_ramp_ms = 180

[multiview]
enabled = true
width = 640
height = 360
fps = 5
jpeg_quality = 55
include_program = true

# The tiles start as stills on this preset, refreshed when the teacher clicks
# one. A laptop on battery keeps its cores for the encoder that way.
[snapshot]
enabled = true
default_width = 320
min_interval_secs = 3
max_width = 1280
idle_secs = 15

[media]
dir = "media"

[control]
bind = "127.0.0.1:8080"

[hardware]
decode = "auto"
encode = "auto"

[[sources]]
id = "teacher"
name = "Teacher"
type = "test/source"
uri = "test://smpte"
params = { uri = "test://smpte" }

[[sources]]
id = "screen"
name = "Screen"
type = "test/source"
uri = "test://snow"
params = { uri = "test://snow" }

# The lesson's own slides or video, played from the media directory.
[[sources]]
id = "slides"
name = "Slides"
type = "file/source"
uri = "media/lesson.mp4"
params = { uri = "media/lesson.mp4" }

# The recording. Any RTMP server on this machine will do; mediamtx writing to
# disk is what most schools end up with. Change this to your own address.
[[outputs]]
id = "recording"
type = "rtmp/output"
uri = "rtmp://127.0.0.1:1935/record/lesson"
policy = "own"
queue_secs = 2.0

[[outputs]]
id = "stream"
type = "rtmp/output"
uri = "rtmp://127.0.0.1:1935/live/lesson"
policy = "own"
queue_secs = 4.0

<!doctype html><title>motion</title>
<!-- A page with a video you can see moving, for trying superimpose from the
     UI: the pattern underneath is decoded by the mixer, the bar across the
     bottom is the page, drawn over it by the browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #101418; overflow: hidden; font: 600 28px/1 sans-serif; color: #fff }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 28px;
         background: rgba(20, 24, 30, 0.72); display: flex; justify-content: space-between }
  #clock { font-variant-numeric: tabular-nums }
</style>
<video id="v" src="motion.mp4" autoplay loop muted playsinline></video>
<div id="bar"><span>LiveboxMix test page: video under, page over</span><span id="clock"></span></div>
<script>
  const c = document.getElementById('clock');
  setInterval(() => { c.textContent = new Date().toLocaleTimeString(); }, 500);
</script>

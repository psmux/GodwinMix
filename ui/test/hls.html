<!doctype html>
<!--
  A development page for HLS outputs: hls.js against /hls/<output>/master.m3u8
  on this core, with the numbers a person checks beside the picture. Served
  only with GMX_UI_DEV=1, at /test/hls.html?out=<output>&key=<viewer key>,
  and with &player=dash it plays the same output's MPD with dash.js.

  hls.js is not part of the product (the page carries no player, see
  ui/panels/renditions/hls-card.js for why), so it is fetched into
  ui/test/vendor by dev/fetch-test-vendor.sh and served from there, only in
  dev mode. The clock at the
  top right is the wall clock in UTC to the millisecond, the same format
  examples/clock_ts.rs burns into its picture, so one screenshot of both
  gives the glass to glass latency.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS check</title>
<style>
  :root { color-scheme: dark; --bg: #101216; --fg: #e8eaee; --dim: #9aa1ad; --line: #2a2f38; --ok: #5fd08a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
  video { width: 100%; background: #000; border-radius: 6px; display: block; }
  #clock { font: 700 44px/1 ui-monospace, Menlo, monospace; letter-spacing: 1px; color: var(--ok); }
  .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-top: 14px; }
  .v { font: 600 20px/1.3 ui-monospace, Menlo, monospace; }
  #levels div { font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--dim); }
  #levels div.on { color: var(--fg); }
  #log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--dim); max-height: 220px; overflow: auto; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 8px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <video id="v" muted autoplay playsinline controls></video>
  <aside>
    <div class="k">Wall clock, UTC</div>
    <div id="clock">--:--:--.---</div>
    <div class="k">Rung playing</div>
    <div class="v" id="level">none yet</div>
    <div class="k">Behind the live edge (hls.js)</div>
    <div class="v" id="latency">-</div>
    <div class="k">Behind the programme date time</div>
    <div class="v" id="pdt">-</div>
    <div class="k">Buffered ahead</div>
    <div class="v" id="buffer">-</div>
    <div class="k">Ladder</div>
    <div id="levels"></div>
    <div id="log"></div>
  </aside>
</main>
<script src="vendor/hls.min.js"></script>
<script src="hls.js"></script>
</body>
</html>

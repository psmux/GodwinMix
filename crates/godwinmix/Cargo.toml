[package]
name = "godwinmix"
description = "Live RTMP video mixer with hot source switching and uninterrupted output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Two binaries, so `cargo run` has to be told which one it is.
default-run = "godwinmix"

# The program is a library with two binaries over it. `gmx` is the name an
# operator types; `godwinmix` is the name a package manager and a service unit
# use. They are the same code, not a copy each.
[lib]
name = "godwinmix"
path = "src/lib.rs"

[[bin]]
name = "godwinmix"
path = "src/main.rs"

[[bin]]
name = "gmx"
path = "src/bin/gmx.rs"

# Simulated LL-HLS viewers, for measuring an HLS output by hand. Its own
# tests run with the rest.
[[example]]
name = "hls_viewers"
test = true

[dependencies]
godwinmix-protocol = { workspace = true }
godwinmix-core = { workspace = true }
# For `gmx plugin test --offline`, which replays a transcript against a plugin
# binary with no core running at all.
godwinmix-host = { workspace = true }
# Channel destinations that ask for a rendition are planned by the pure
# planner and admitted by the governor, both in the core, where the codec
# catalogue and the streams' shapes are (src/channels/transcode/).
godwinmix-render = { workspace = true }
godwinmix-govern = { workspace = true }
# Tier W, behind the `wasm` feature. Optional because wasmtime is a compiler
# and most builds do not want one; `docs/reference/wasm.md` has the
# measurement and the rule.
godwinmix-wasm = { workspace = true, optional = true }

# The control plane builds pipelines through the engine, but it also starts
# GStreamer itself and the bench command builds elements directly.
gstreamer = { workspace = true }
# The appsrc a direct show's HLS output is fed through (station/direct/hls).
# Already in the tree under the engine.
gstreamer-app = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time", "io-std", "io-util", "fs", "process"] }
axum = { workspace = true, features = ["ws"] }
# `rustls-tls-webpki-roots` so a feed can read a wss:// address (src/feeds/).
# Already compiled for godwinmix-tui, so nothing new is built.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# HTTPS on the control port (src/tls.rs). Already in the tree under the node
# bridge and the core, so nothing new to compile.
tokio-rustls = { workspace = true }
tower-http = { workspace = true, features = ["fs", "cors", "trace"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
parking_lot = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
# `stream` for the station's relay, which passes a show's MJPEG and PCM
# streams and an upload through without holding them in memory.
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
libc = { workspace = true }
base64 = { workspace = true }
# Checks the web page engine download against the digest its index publishes.
# Already in the tree under tungstenite, so it adds nothing to a build.
sha1 = "0.10"

[features]
default = ["matte"]
# The person cutout with no green screen. On by default: the model and the
# runtime are loaded only when somebody adds the filter. See
# godwinmix-core/src/plugin/filters/matte/.
matte = ["godwinmix-core/matte"]
# Run `service` and `transition` plugins as WebAssembly components inside the
# core (tier W). Off by default: it adds 11.9 MB to a release binary on
# macos-aarch64 and takes the whole binary to 30.4 MB, and 09 section 4 item 4
# gives a feature 4 MB and the binary 30 MB. `gmx doctor` says whether a build
# carries it, on the `wasm host` line.
wasm = ["dep:godwinmix-wasm"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[package]
name = "godwinmix"
description = "Live RTMP video mixer with hot source switching and uninterrupted output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Two binaries, so `cargo run` has to be told which one it is.
default-run = "godwinmix"

# The program is a library with two binaries over it. `gmx` is the name an
# operator types; `godwinmix` is the name a package manager and a service unit
# use. They are the same code, not a copy each.
[lib]
name = "godwinmix"
path = "src/lib.rs"

[[bin]]
name = "godwinmix"
path = "src/main.rs"

[[bin]]
name = "gmx"
path = "src/bin/gmx.rs"

[dependencies]
godwinmix-protocol = { workspace = true }
godwinmix-core = { workspace = true }

# The control plane builds pipelines through the engine, but it also starts
# GStreamer itself and the bench command builds elements directly.
gstreamer = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time", "io-std", "io-util", "fs"] }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["fs", "cors", "trace"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
parking_lot = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
libc = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

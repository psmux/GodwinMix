[package]
name = "godwinmix-core"
description = "The GodwinMix mixing engine as a library: pipeline, sources, outputs, plugins and scenes, with no server and no CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
godwinmix-protocol = { workspace = true }
# The tier 2 host: the launch plan, the JSON lines channel, the handshake, the
# lifecycle and the budgets. No GStreamer, no server, no runtime of its own; it
# is the half of a sidecar that is not a pipeline. See `plugin/host/`.
godwinmix-host = { workspace = true }
# The rendition planner (pure) and the resource governor. The governor's
# `calibrate` feature times the catalogue's encoders with GStreamer, which
# this crate has anyway. See `render/`.
godwinmix-render = { workspace = true }
godwinmix-govern = { workspace = true, features = ["calibrate"] }
# The frame bus: a device or a stream decoded once and read by every source
# that uses it, in this process or another. See `plugin/host/shared/`.
godwinmix-framebus = { workspace = true }

gstreamer = { workspace = true }
gstreamer-video = { workspace = true }
gstreamer-audio = { workspace = true }
gstreamer-app = { workspace = true }
# `v1_20` for the RFC 6381 codec string an HLS playlist names each rung by.
gstreamer-pbutils = { workspace = true, features = ["v1_20"] }
gstreamer-controller = { workspace = true }
# The net clock: a time provider on the core, a client clock on a node.
gstreamer-net = { workspace = true }
# WHEP playback: `webrtcbin`'s session description and its SDP. Already in
# the tree through the ingest plugin's WHIP; the libraries are part of
# gst-plugins-bad, which the core needs anyway. See `whep/`.
gstreamer-webrtc = "0.24"
gstreamer-sdp = "0.24"
glib = { workspace = true }
# HLS segments, shared by reference with every viewer. See `hls/`.
bytes = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time", "io-std", "io-util", "fs", "net", "process"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
# Writing the config file back with its comments. See `config/edit.rs`.
toml_edit = { workspace = true }
schemars = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
# No `env-filter`: `observe::logs` reads RUST_LOG itself, into the same
# level tables `log.set` moves at runtime, so the feature was carrying a
# regex engine that nothing called.
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
shell-words = { workspace = true }
libc = { workspace = true }
image = { workspace = true }
getrandom = { workspace = true }

# The node bridge: one WebSocket per node, mutual TLS, certificates the core
# issues itself, and AES-GCM for secrets at rest. See `node/`.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }

# The person cutout (`matte/filter`), when the `matte` feature is on. Loaded
# at run time and never linked: the binary starts on a machine with no ONNX
# Runtime, and the filter says where to get one. API 20 is ONNX Runtime 1.20,
# so any runtime from 1.20 on serves it. See `plugin/filters/matte/`.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-20", "cuda", "openvino"], optional = true }

# The platform's own accelerator for the cutout: registration code only, the
# runtime that carries it is still found at run time.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"], optional = true }
# Loads DirectML.dll from beside onnxruntime.dll before the runtime asks for
# it: Windows does not look in a library's own folder for what it needs.
libloading = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"], optional = true }

[features]
default = []
# A person cut out of the camera picture with no green screen, by a matting
# model on whatever the machine has: DirectML, CoreML, CUDA, OpenVINO or the
# CPU. Adds the `ort` bindings and no native code.
matte = ["dep:ort", "dep:libloading"]

[dev-dependencies]
# Paused time, so the multiview linger tests assert on two seconds without
# waiting two seconds. Test only: the shipped binary does not carry it.
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

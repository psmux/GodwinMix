[package]
name = "godwinmix-protocol"
description = "The GodwinMix control protocol: request, response, event and status types, error codes, scopes, the method table and the schema generators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No media stack and no transport. A client library, an SDK or a test harness
# depends on this and pulls in nothing that has to be installed first.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
# `gmx-plugin.toml` is read here rather than in the host so that the SDK, the
# harness and the index all parse a manifest with the same code.
toml = { workspace = true }
# One warning line in `types.rs` and two mutexes. Both are facades with no
# runtime of their own; neither pulls in a media stack or a server.
tracing = { workspace = true }
parking_lot = { workspace = true }
# `sync` only: a Notify so two requests racing on one idempotency key do not
# both run the work. No runtime, no media stack, no system library; a client
# library depending on this still installs with one cargo add.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# The idempotency race test needs a runtime and a clock. Test only.
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }

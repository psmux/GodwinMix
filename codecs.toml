[[video]]
id = "h264-software-x264"
codec = "h264"
accel = "software"
rank = 72
encoder = "x264enc"
parser = "h264parse"
requires = []
license = "GPL-2.0-or-later"
container = ["flv", "mpegts", "mp4", "matroska"]
keyframe = { property = "key-int-max", unit = "frames" }
verified = []
comment = "Preferred over openh264 where it is installed, and never bundled: x264 is GPL and the operator installs gst-plugins-ugly themselves. B frames are off everywhere because they cost latency and buy little at live bitrates. `byte-stream = false` because the FLV muxer wants AVC sample format. Encode only: H.264 is decoded by openh264dec below, or by libav where openh264 is missing."
properties = { "speed-preset" = "veryfast", tune = "zerolatency", pass = "cbr", bitrate = { unit = "kbit", from = "video.bitrate_kbps" }, bframes = 0, aud = false, "byte-stream" = false, threads = { unit = "count", from = "cpu.count" } }

[[video]]
id = "h264-software-openh264"
codec = "h264"
accel = "software"
rank = 64
encoder = "openh264enc"
decoder = "openh264dec"
parser = "h264parse"
requires = []
license = "BSD-2-Clause"
container = ["flv", "mpegts", "mp4", "matroska"]
keyframe = { property = "gop-size", unit = "frames" }
verified = []
comment = "The permissive fallback. Cisco's openh264 is BSD licensed, so it ships in every build including a closed custom one, and it is what the GPU free CI runner exercises on every commit. Its decoder is the software H.264 decoder ahead of libav. It takes 4:2:0 8 bit streams (baseline, main and high); a High 10 or 4:2:2 stream does not match its caps and goes to avdec_h264. It does not decode interlaced coding, and it runs on one thread: on a 1080p30 high profile stream it cost about 1.5 times avdec_h264's CPU time. A machine taking interlaced broadcast feeds, or decoding several cameras on the CPU, wants `GMX_CODEC_RANK=h264-software-decode=70`."
properties = { complexity = "low", "rate-control" = "bitrate", bitrate = { unit = "bit", from = "video.bitrate_kbps" }, "multi-thread" = { unit = "count", from = "cpu.count" } }


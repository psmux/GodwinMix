# The GodwinMix codec and graphics catalogue.
#
# This file is data, not code. A new GPU generation, a renamed element or a
# different codec is an entry here, not a core release. It ships embedded in
# the binary, an operator overrides it with a `[codecs]` table in their config
# or with `--codecs <file>`, and `GMX_CODEC_RANK` adjusts a rank from the
# environment without editing anything.
#
# How an entry is read
# --------------------
# `rank`      higher wins among the entries whose elements are installed.
# `requires`  extra registry elements the entry needs. The role's own element
#             (`encoder` for encoding, `decoder` for decoding) is always
#             required on top of this, and naming the other role's element in
#             `requires` does not block this one: a machine with NVDEC and no
#             usable NVENC is a real configuration and keeps its fast decoder.
# `properties` are set defensively. A property this element version does not
#             have, or a nickname its enum does not know, is a logged warning
#             and never a crash. A value written `{ unit = "...", from = "..." }`
#             is filled in at build time from the running configuration and
#             converted into the unit this element wants, so the catalogue
#             states the bitrate once and openh264 gets bits while x264 gets
#             kilobits.
# `keyframe`  the property that carries the keyframe interval, and its unit.
# `container` the containers this codec can be muxed into. Selection keeps to
#             the container the programme is going out in.
# `license`   every entry carries one. `gmx build` refuses to bundle a copyleft
#             entry into a custom build, which is why the always present
#             fallbacks are openh264 and SVT-AV1 and x264 is an entry the
#             operator installs.
# `verified`  appended by whoever ran `gmx codec test` on real hardware.
#             `gmx doctor` compares this machine against the list and says so
#             when an entry has never been tried on this driver.
#
# Variables a `from` may name, with the unit they are held in:
#   video.bitrate_kbps   kbit      audio.bitrate_kbps   kbit
#   keyframe.frames      frames    keyframe.secs        seconds
#   canvas.fps           count     cpu.count            count
# Units that convert into each other: bit, kbit, mbit; frames, seconds; count.

# ---------------------------------------------------------------------------
# H.264, hardware
# ---------------------------------------------------------------------------

[[video]]
id = "h264-nvidia"
codec = "h264"
accel = "nvidia"
rank = 240
encoder = "nvh264enc"
decoder = "nvh264dec"
download = "cudadownload"
parser = "h264parse"
memory = "system"
requires = ["nvh264enc"]
license = "LGPL-2.1-or-later"
container = ["flv", "mpegts", "mp4", "matroska"]
keyframe = { property = "gop-size", unit = "frames" }
verified = []
comment = "NVENC on Linux and Windows. `preset` is the modern nvcodec naming; an older nvh264enc ignores it with a warning and keeps its default, which is why `zerolatency` is set as well."
properties = { preset = "p4", tune = "ultra-low-latency", "rc-mode" = "cbr", bitrate = { unit = "kbit", from = "video.bitrate_kbps" }, "max-bitrate" = { unit = "kbit", from = "video.bitrate_kbps" }, bframes = 0, "b-frames" = 0, zerolatency = true, "aud" = false }


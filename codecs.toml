# ---------------------------------------------------------------------------
# Containers
#
# The output kind picks its container; the catalogue says which muxer that
# container is and what it can carry, so a codec and a destination that cannot
# agree are caught at selection rather than at the first frame.
# ---------------------------------------------------------------------------

[[container]]
name = "flv"
muxer = "flvmux"
video = ["h264"]
audio = ["aac"]
streamable = true
properties = { streamable = true, "start-time-selection" = "first", "enforce-increasing-timestamps" = true, "skip-backwards-streams" = true }

[[container]]
name = "mpegts"
muxer = "mpegtsmux"
video = ["h264", "h265", "av1"]
audio = ["aac", "opus"]
streamable = true

[[container]]
name = "mp4"
muxer = "mp4mux"
video = ["h264", "h265", "av1"]
audio = ["aac", "opus"]
streamable = false
properties = { "faststart" = true }

[[container]]
name = "matroska"
muxer = "matroskamux"
video = ["h264", "h265", "av1"]
audio = ["aac", "opus"]
streamable = true
properties = { streamable = true }

[[container]]
name = "webm"
muxer = "webmmux"
video = ["av1"]
audio = ["opus"]
streamable = true
properties = { streamable = true }

[[container]]
name = "ogg"
muxer = "oggmux"
video = []
audio = ["opus"]
streamable = true

# ---------------------------------------------------------------------------
# Graphics: the compositor and the conversion backend
#
# The canvas contract at the plugin boundary does not change. What changes is
# what the core does after the boundary: with a GPU entry a frame is uploaded
# once and stays in device memory through conversion, compositing and into the
# encoder, and comes back to system memory only for the multiview JPEG and for
# a software encoder.
#
# Every GPU compositor here is rank none in GStreamer 1.28, which means
# GStreamer itself will not auto select it. `glvideomixer` has open bugs on
# dynamic pad add and remove (#3833), on DMA memory between GPU and CPU
# (#3457) and a crash with `gltransformation` (#4515). So the software entry
# stays the default until a GPU entry carries a `verified` record for this
# platform, earned by `gmx codec test` plus a 60 minute add and remove soak.
# Pinning `[hardware] graphics = "gl"` overrides that and is how the soak gets
# run in the first place.
# ---------------------------------------------------------------------------

[[graphics]]
id = "cuda"
accel = "cuda"
rank = 240
compositor = "cudacompositor"
convert = "cudaconvert"
upload = "cudaupload"
download = "cudadownload"
memory = "cuda"
requires = ["cudacompositor", "cudaconvert"]
license = "LGPL-2.1-or-later"
verified = []

[[graphics]]
id = "gl"
accel = "gl"
rank = 200
compositor = "glvideomixer"
convert = "glcolorconvert"
upload = "glupload"
download = "gldownload"
memory = "gl"
requires = ["glvideomixer", "glcolorconvert", "gldownload"]
license = "LGPL-2.1-or-later"
verified = []
comment = "DMABUF import on Linux, IOSurface on macOS. `glvideomixer` is a bin that uploads on each of its own sink pads, so a source still arrives in system memory and nothing above the compositor has to know. One GL display is shared across every pipeline in the process, which is what stopped a descriptor leak here once already."


# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------

# AAC is what RTMP carries, so every machine needs an encoder for it. The
# order is quality first and libav last: Fraunhofer's encoder where the
# operator has installed it, the operating system's own on a Mac and on
# Windows, then VisualOn's, then FFmpeg's. Each encoder's priming delay is
# measured by `catalogue::priming_tests` on every CI platform that has it,
# against a beep at a known time, and that test fails when the number here is
# wrong by more than a few milliseconds. Decoding is ranked the same way, with
# the libav decoders in entries of their own at rank 30 so they are taken only
# when nothing else is installed.

[[audio]]
id = "aac-fdk"
codec = "aac"
accel = "software"
rank = 120
encoder = "fdkaacenc"
decoder = "fdkaacdec"
parser = "aacparse"
requires = []
license = "FDK-AAC"
container = ["flv", "mpegts", "mp4", "matroska"]
priming_delay_ms = 43
verified = []
comment = "The best AAC encoder there is for GStreamer. 2048 samples of priming delay at 48 kHz, measured on air with browser/dev/tail-offset.sh: a file whose flash and beep coincide came out with the beep 43 ms late, whatever the video encoder. The Fraunhofer licence allows redistribution but grants no patent licence and does not mix with the GPL, so no release bundle carries it: x264 and faad travel in the same runtimes. An operator installs it (`gstreamer1.0-fdkaac` on Ubuntu and Debian) and it is taken from then on."
properties = { bitrate = { unit = "bit", from = "audio.bitrate_kbps" }, "rate-control" = "cbr", "perfect-timestamp" = true }

[[audio]]
id = "aac-audiotoolbox"
codec = "aac"
accel = "software"
rank = 116
encoder = "atenc"
parser = "aacparse"
requires = []
license = "LGPL-2.1-or-later"
container = ["flv", "mpegts", "mp4", "matroska"]
priming_delay_ms = 44
verified = []
comment = "Apple's AAC encoder through AudioToolbox, on every Mac with GStreamer 1.26 or newer. As good as Fraunhofer's. atenc leaves Apple's 2112 samples of encoder delay in its timestamps (its source says so), which is 44 ms at 48 kHz, and the priming test measures it on the macOS runner. Encode only; Apple's decoder is the entry below."
properties = { bitrate = { unit = "bit", from = "audio.bitrate_kbps" }, "rate-control" = "cbr", "perfect-timestamp" = true }

[[audio]]
id = "aac-audiotoolbox-decode"
codec = "aac"
accel = "software"
rank = 80
decoder = "atdec"
parser = "aacparse"
requires = []
license = "LGPL-2.1-or-later"
container = ["flv", "mpegts", "mp4", "matroska"]
verified = []
comment = "Decode only. Apple's AAC decoder, ranked under faad: with atdec first, a receiver decoding the programme from a live MPEG-TS stream on the macOS runner stopped after three or four pictures, twice, where faad and libav keep going. It is what a Mac with neither faad nor gst-libav decodes AAC with."

[[audio]]
id = "aac-mediafoundation"
codec = "aac"
accel = "software"

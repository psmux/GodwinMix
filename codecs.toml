[[graphics]]
id = "software"
accel = "software"
rank = 64
compositor = "compositor"
convert = "videoconvert"
memory = "system"
requires = ["compositor", "videoconvert"]
license = "LGPL-2.1-or-later"
verified = [{ platform = "any", driver = "cpu", gstreamer = "1.24+", by = "project CI", date = "2026-09-14", report = "the default path on every runner, GPU free included" }]
comment = "Always present, and what a Pi or a five year old laptop gets. It is what the mixer has always done: `compositor` in I420 and one `videoconvert` in front of the encoder."

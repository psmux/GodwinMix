[package]
name = "godwinmix"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Live RTMP video mixer with hot source switching and uninterrupted output"
# Two binaries, so `cargo run` has to be told which one it is.
default-run = "godwinmix"

# The program is a library with two binaries over it. `gmx` is the name an
# operator types; `godwinmix` is the name a package manager and a service unit
# use. They are the same code, not a copy each.
[lib]
name = "godwinmix"
path = "src/lib.rs"

[[bin]]
name = "godwinmix"
path = "src/main.rs"

[[bin]]
name = "gmx"
path = "src/bin/gmx.rs"

[dependencies]
gstreamer = "0.24"
gstreamer-video = "0.24"
gstreamer-audio = "0.24"
gstreamer-app = "0.24"
glib = "0.21"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "io-std", "io-util", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
gstreamer-pbutils = "0.24"
# rustls rather than the platform's TLS: the same binary reaches an https
# mixer or media address on Linux, macOS and Windows, and CI needs no OpenSSL
# headers. Without a TLS feature at all, which is how this stood, every https
# URL failed at connect: ctl and mcp against a mixer behind Cloudflare, and a
# page's media on an https CDN.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
shell-words = "1.1.1"
libc = "0.2.189"
# Only the JPEG codec: the snapshot endpoints crop cells out of the mosaic
# frames, which are already JPEG, and hand them back as JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

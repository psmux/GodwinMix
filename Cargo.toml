# The workspace root. There is no package here: every crate lives under
# `crates/`, and the glob means a new one joins by existing.
#
#   godwinmix-protocol  the wire contract, types and schema, no media stack
#   godwinmix-core      the mixing engine as a library, no server
#   godwinmix-host      the tier 2 sidecar host
#   godwinmix           the binaries, the control server, the CLI
#
# See docs/explanation/architecture.md for what belongs in each.
[workspace]
resolver = "2"
# A glob, so a new crate joins by existing and nobody has to remember to edit
# this list. The one rule it imposes: a directory under `crates/` must carry a
# `Cargo.toml`. Git does not track empty directories, so a clone never has one;
# if you make a crate by hand, write the manifest before running cargo.
members = ["crates/*", "plugins/*"]
# Same glob, so `cargo build` at the root builds every crate and `cargo run`
# still reaches the `godwinmix` binary through its `default-run`.
default-members = ["crates/*", "plugins/*"]
# Both have their own lockfiles and their own heavy dependency trees, and
# neither is built by `cargo build` here.
# `browser` and `tauri-app` have their own lockfiles and their own heavy
# dependency trees. The three tier W crates are excluded for a different
# reason: they are built for `wasm32-wasip2` and have nothing to link against
# on a host target. `docs/how-to/write-a-wasm-plugin.md` has the build line.
exclude = [
    "browser",
    "tauri-app",
    "crates/godwinmix-sdk-wasm",
    "plugins/min-hold",
    "examples/wasm-ease",
]

[workspace.package]
version = "0.3.17"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/psmux/godwinmix"

# One version per dependency for the whole tree. A crate opts in with
# `dep = { workspace = true }` and adds only the features it needs.
[workspace.dependencies]
godwinmix-protocol = { path = "crates/godwinmix-protocol", version = "0.3.17" }
godwinmix-core = { path = "crates/godwinmix-core", version = "0.3.17" }
godwinmix-host = { path = "crates/godwinmix-host", version = "0.3.17" }
godwinmix-govern = { path = "crates/godwinmix-govern", version = "0.3.17" }
godwinmix-framebus = { path = "crates/godwinmix-framebus", version = "0.3.17" }
godwinmix-render = { path = "crates/godwinmix-render", version = "0.3.17" }
godwinmix-flussonic = { path = "crates/godwinmix-flussonic", version = "0.3.17" }

gstreamer = "0.24"
gstreamer-video = "0.24"
gstreamer-audio = "0.24"
gstreamer-app = "0.24"
gstreamer-pbutils = "0.24"
# libgstcontroller: the interpolation control sources transitions bind to a
# compositor pad with, sampled by the aggregator per output frame rather than
# written by a thread. Same version family as the rest of the bindings.
gstreamer-controller = "0.24"
# libgstnet: the net clock. The core runs a `GstNetTimeProvider` on the
# programme clock and every node runs a `GstNetClientClock` against it, which
# is the only way two machines agree what running time means. Same version
# family as the rest of the bindings.
gstreamer-net = "0.24"
glib = "0.21"
# Reference counted byte buffers. Already in the tree under axum and hyper; the
# HLS packager holds its segments in them so every viewer is handed the same
# memory rather than a copy.
bytes = "1.9"

tokio = "1"
axum = "0.8"
# Already in the tree behind axum's `ws` feature. Here as a client, so the
# MCP server can hold a /rpc socket and forward event/agent.state as a
# notification instead of polling.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tower-http = "0.6"

serde = "1"
serde_json = "1"
toml = "0.9"
# The one way to write a person's config file back without destroying it:
# `toml` serialises from values and throws away every comment, and the config
# file is commented on nearly every line. Already in the tree under
# proc-macro-crate, at the same version, so nothing new is compiled.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
schemars = "1"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = "4"
parking_lot = "0.12"
futures-util = { version = "0.3.34", default-features = false }
# rustls rather than the platform's TLS: the same binary reaches an https
# mixer or media address on Linux, macOS and Windows, and CI needs no OpenSSL
# headers.
reqwest = { version = "0.12", default-features = false }
shell-words = "1.1.1"
libc = "0.2.189"
# Only the JPEG codec: the snapshot endpoints crop cells out of the mosaic
# frames, which are already JPEG, and hand them back as JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
# Sixteen random bytes for a UUIDv7. The `uuid` crate would be a whole crate to
# format a 128 bit integer we already have to generate ourselves; getrandom is
# already in the tree under rustls and costs nothing new to compile.
getrandom = "0.3"

# The tier W host, behind the binary's `wasm` feature. Kept at the 36 LTS line:
# it asks for Rust 1.86 rather than the 1.95 the current release wants, and the
# component model has not moved under it.
wasmtime = { version = "36", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "gc-drc"] }
wasmtime-wasi = { version = "36", default-features = false }
godwinmix-wasm = { path = "crates/godwinmix-wasm", version = "0.3.17" }
# The node bridge. rustls and tokio-rustls are already in the tree under
# reqwest; naming them here makes the core a TLS server as well as a client,
# which is what mutual TLS between a node and the core needs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1.15"
# The core is a small certificate authority: it signs one certificate per node
# with a SPIFFE style identity. Writing X.509 DER by hand to avoid a crate
# would be a worse trade than this one, which is three pure Rust crates over
# the `ring` already compiled in.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# AES-GCM for secrets at rest, from the `ring` rustls already pulls in. No new
# compilation, and the alternative was inventing a cipher.
ring = "0.17"

# Size first for the control plane, speed for the engine. The binary budget
# is 30 MB on linux-aarch64 (docs/explanation/footprint-budgets.md), and the
# station, the channels and the matte filter took the unstripped x86_64 build
# from 23.2 MB on 2026-10-01 to 38.7 MB by 2026-10-11. Measured on ci-linux
# that day: symbols stripped 34.6 MB; opt-level "s" on the two binary crates
# only, 30.0 MB; "s" everywhere but the engine, 28.7 MB; "s" everywhere,
# 25.5 MB. The engine and the frame bus stay at 3 because they carry the
# per frame Rust code (the overlay blend, telemetry, the frame bus copies);
# everything else is serde, HTTP and control plane, which no frame waits on.
# Symbols are stripped because the shipped aarch64 build was already stripped
# by hand in release.yml; panics still name the file and line.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.package.godwinmix-core]
opt-level = 3

[profile.release.package.godwinmix-framebus]
opt-level = 3

# Optimized tests without repeating the shipping binary's whole-program link.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

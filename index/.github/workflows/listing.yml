# The listing workflow, end to end, in six lines.
#
# 1. A pull request that touches index.json runs the bot: the schema, the source
#    forms, the tier requirements and the fixtures, in under a minute.
# 2. A merge to main, or a manual run naming one plugin, resolves that entry and
#    checks out the tagged source it points at.
# 3. Five runners build it and run `gmx plugin test` against it, and each one
#    packages its result as <plugin>-<version>-<platform>.tar.gz, .zip on Windows.
# 4. One job signs every asset with sigstore, keyless, and publishes the assets
#    and their bundles as release assets on this repository.
# 5. One job writes the shields.io endpoint for the plugin's tier into badges/.
# 6. One job regenerates compatibility.md and commits it when it moved.

name: listing

on:
  pull_request:
    paths:
      - "index.json"
      - "schema.json"
      - "bot/**"
      - ".github/workflows/listing.yml"
  push:
    branches:
      - main
    paths:
      - "index.json"
  workflow_dispatch:
    inputs:
      plugin:
        description: "The name of the listing to build, as it appears in index.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: listing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The core release the harness runs in. Bump it when a new core ships.
  GMX_VERSION: "0.2.0"

jobs:
  # -------------------------------------------------------------------------
  # What runs on a pull request
  # -------------------------------------------------------------------------
  validate:
    name: Validate the listing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the index
        uses: actions/checkout@v4

      - name: Use the Python the bot is written against
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the bot's own fixtures, so a broken bot fails before a listing does
        run: python3 bot/validate.py --self-test

      - name: Check index.json is JSON and schema.json is JSON
        run: python3 -c "import json; json.load(open('index.json')); json.load(open('schema.json'))"

      - name: Validate every listing in index.json
        run: python3 bot/validate.py

      - name: Check compatibility.md is what the generator writes
        run: python3 bot/dashboard.py --check

  # -------------------------------------------------------------------------
  # Which listing is being built
  # -------------------------------------------------------------------------
  resolve:
    name: Resolve which listing to build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.pick.outputs.plugin }}
      version: ${{ steps.pick.outputs.version }}
      repository: ${{ steps.pick.outputs.repository }}
      tag: ${{ steps.pick.outputs.tag }}
      tier: ${{ steps.pick.outputs.tier }}
      platforms: ${{ steps.pick.outputs.platforms }}
      found: ${{ steps.pick.outputs.found }}
    steps:
      - name: Check out the index with the previous commit, to see what changed
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use the Python the bot is written against
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the entry this run is about
        id: pick
        env:
          WANTED: ${{ inputs.plugin }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess

          doc = json.load(open("index.json"))
          wanted = os.environ.get("WANTED", "").strip()

          def changed():
              """The entries whose JSON is different from the previous commit."""
              try:
                  before = subprocess.run(
                      ["git", "show", "HEAD~1:index.json"],
                      capture_output=True, text=True, check=True).stdout
                  old = {p["name"]: p for p in json.loads(before).get("plugins", [])}
              except Exception:
                  old = {}
              return [p["name"] for p in doc["plugins"] if old.get(p["name"]) != p]


          names = [wanted] if wanted else changed()
          entry = next((p for p in doc["plugins"] if p["name"] in names), None)
          if entry is None:
              print("found=no")
              raise SystemExit(0)

          version = (entry.get("versions") or [{}])[-1]
          source = entry["source"]
          print("found=yes")
          print("plugin=%s" % entry["name"])
          print("tier=%s" % entry.get("tier", "custom"))
          print("version=%s" % version.get("version", ""))
          print("repository=%s" % source.split("@")[0])
          print("tag=v%s" % version.get("version", ""))
          print("platforms=%s" % json.dumps(version.get("platforms", [])))
          PY

      - name: Say what was resolved
        run: |
          echo "plugin:   ${{ steps.pick.outputs.plugin }}"
          echo "version:  ${{ steps.pick.outputs.version }}"
          echo "source:   ${{ steps.pick.outputs.repository }}"
          echo "tier:     ${{ steps.pick.outputs.tier }}"

  # -------------------------------------------------------------------------
  # Build and test on every platform the project supports
  # -------------------------------------------------------------------------
  build:
    name: Build and test on ${{ matrix.platform }}
    needs: resolve
    if: needs.resolve.outputs.found == 'yes'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-latest
          - platform: macos-x86_64
            runner: macos-13
          - platform: windows-x86_64
            runner: windows-latest
    steps:
      - name: Check out the index, for the bot and the schema
        uses: actions/checkout@v4
        with:
          path: index

      - name: Check out the plugin at the tag the listing names
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: plugin

      - name: Use the Python the bot is written against
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the GodwinMix core the harness runs inside
        shell: bash
        run: |
          set -euo pipefail
          asset="godwinmix-${GMX_VERSION}-${{ matrix.platform }}.tar.gz"
          url="https://github.com/psmux/godwinmix/releases/download/v${GMX_VERSION}/${asset}"
          curl --fail --silent --show-error --location --output core.tar.gz "$url"
          mkdir -p core
          tar xzf core.tar.gz -C core
          echo "$GITHUB_WORKSPACE/core" >> "$GITHUB_PATH"

      - name: Run the plugin's own build, when its manifest declares one
        shell: bash
        working-directory: plugin
        run: |
          set -euo pipefail
          command=$(python3 - <<'PY'
          import re
          text = open("gmx-plugin.toml", encoding="utf-8").read()
          block = re.search(r"^\[build\]\s*$(.*?)(^\[|\Z)", text, re.S | re.M)
          if block:
              found = re.search(r'^\s*command\s*=\s*"(.*?)"', block.group(1), re.M)
              print(found.group(1) if found else "")
          PY
          )
          if [ -z "$command" ]; then
            echo "no [build] block, so there is nothing to build here"
          else
            echo "running: $command"
            bash -lc "$command"
          fi

      - name: Run the conformance harness and record what it found
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gmx plugin test plugin | tee harness.log
          passed=$(grep -c '^  ok  ' harness.log || true)
          total=$(grep -cE '^  (ok  |FAIL )' harness.log || true)
          echo "${{ matrix.platform }}: ${passed}/${total}" | tee "dist/${{ matrix.platform }}.harness"

      - name: Check the listing against the source that was just built
        shell: bash
        run: |
          python3 index/bot/validate.py \
            --index index/index.json \
            --entry "${{ needs.resolve.outputs.plugin }}" \
            --plugin-dir "$GITHUB_WORKSPACE/plugin"

      - name: Package the plugin as a tar.gz
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ needs.resolve.outputs.plugin }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}"
          mkdir -p dist
          tar czf "dist/${name}.tar.gz" -C plugin .
          ls -l dist

      - name: Package the plugin as a zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ needs.resolve.outputs.plugin }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path plugin\* -DestinationPath "dist\$name.zip"
          Get-ChildItem dist

      - name: Upload this platform's asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # Sign what was built, and publish it
  # -------------------------------------------------------------------------
  sign:
    name: Sign the assets and publish the release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      # The keyless signature is minted from this token. Without it cosign has
      # no identity to sign as.
      id-token: write
      contents: write
    steps:
      - name: Check out the index
        uses: actions/checkout@v4

      - name: Download every platform's asset
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign every asset, keyless, one bundle beside each
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for asset in dist/*.tar.gz dist/*.zip; do
            echo "signing $asset"
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done

      - name: Verify what was just signed, so a bad bundle never reaches a release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          identity=$(python3 -c "import json;print(json.load(open('index.json'))['signing']['identity_regexp'])")
          issuer=$(python3 -c "import json;print(json.load(open('index.json'))['signing']['oidc_issuer'])")
          for asset in dist/*.tar.gz dist/*.zip; do
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$asset"
          done

      - name: Publish the assets and the bundles as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.plugin }}-v${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "${{ needs.resolve.outputs.plugin }} ${{ needs.resolve.outputs.version }}" \
              --notes "Built and signed by the listing workflow. Verify with the identity in index.json."
          fi
          gh release upload "$TAG" dist/* --clobber

  # -------------------------------------------------------------------------
  # The badge and the dashboard
  # -------------------------------------------------------------------------
  badges:
    name: Write the badge endpoint
    needs: [resolve, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the index
        uses: actions/checkout@v4

      - name: Write one shields.io endpoint per listing
        run: |
          python3 - <<'PY'
          import json, os
          colour = {
              "custom": "lightgrey",
              "bronze": "cd7f32",
              "silver": "c0c0c0",
              "gold": "ffd700",
          }
          doc = json.load(open("index.json"))
          os.makedirs("badges", exist_ok=True)
          for entry in doc["plugins"]:
              tier = entry.get("tier", "custom")
              body = {
                  "schemaVersion": 1,
                  "label": "godwinmix",
                  "message": tier,
                  "color": colour.get(tier, "lightgrey"),
              }
              with open(os.path.join("badges", entry["name"] + ".json"), "w") as f:
                  json.dump(body, f, indent=2)
                  f.write("\n")
              print("badges/%s.json %s" % (entry["name"], tier))
          PY

      - name: Upload the badges, so a run can be inspected without a branch
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: badges/

      - name: Push the badges onto the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The branch holds generated JSON and nothing else, so it is rebuilt
          # from one orphan commit every run. There is no history worth keeping
          # and no merge that could ever be wanted.
          git config user.name "godwinmix-listing-bot"
          git config user.email "bot@users.noreply.github.com"
          mv badges "$RUNNER_TEMP/badges"
          git checkout --orphan badges-rebuild
          git rm -rf --quiet .
          mv "$RUNNER_TEMP/badges" badges
          git add badges
          git commit -m "badges: ${{ needs.resolve.outputs.plugin }} ${{ needs.resolve.outputs.version }}"
          git push --force origin badges-rebuild:badges

  dashboard:
    name: Regenerate compatibility.md
    needs: [resolve, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the index
        uses: actions/checkout@v4

      - name: Use the Python the bot is written against
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite the dashboard from index.json
        run: python3 bot/dashboard.py

      - name: Commit it when it moved
        run: |
          set -euo pipefail
          git config user.name "godwinmix-listing-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet compatibility.md; then
            echo "the dashboard did not move"
          else
            git add compatibility.md
            git commit -m "compatibility: ${{ needs.resolve.outputs.plugin }} ${{ needs.resolve.outputs.version }}"
            git push
          fi

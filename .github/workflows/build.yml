name: build

# The mixer and its tests on the three platforms it runs on, plus two jobs that
# exist because of what they catch rather than what they build: a Linux runner
# with no GPU at all, which is the path most people are on and the one nobody
# would otherwise run, and an aarch64 build, because a Raspberry Pi is a target
# and cross compilation breaks quietly.
#
# GStreamer comes from each platform's usual package source. The CEF sidecar is
# only checked, not built, because its build downloads a Chromium distribution
# and would double the time of every run.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing here and saves a re-run when a test panics.
  RUST_BACKTRACE: 1

# A new push to the same branch makes the run in flight pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixer:
    name: mixer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the six hours GitHub allows. 90
    # rather than 45 because of what Windows costs: the GStreamer MSIs come
    # down through chocolatey, a cold cargo cache builds the whole workspace
    # with MSVC, and the test step alone measured 31 minutes on the first
    # Windows run. `platforms.yml` has been at 90 for the same reason.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools xvfb libgl1-mesa-dri

      - name: GStreamer (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Windows has no package of the MSVC runtime that cargo can find on its
      # own. The chocolatey packages install the official MSIs under Program
      # Files and the three variables below are what the gstreamer crate's
      # build script looks at. This is also the step that will bundle a trimmed
      # GStreamer into the Tauri .msi when Phase 3 lands: the target is a 150 MB
      # installer against the 527 MB the stock runtime installer costs, and
      # until then a Windows user installs GStreamer themselves.
      - name: GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y --no-progress gstreamer gstreamer-devel
          $gst = "C:\Program Files\gstreamer\1.0\msvc_x86_64"
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst\" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$gst\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: cargo build --release --locked -p godwinmix --bins

      # The tests build real GStreamer pipelines. They are the drift check for
      # protocol.json as well: the test that asserts every route in control.rs
      # appears in the committed schema runs here, so a schema change without a
      # regenerated protocol.json fails this job on every platform.
      - name: Test
        shell: bash
        env:
          # No GPU on a hosted runner: Mesa's software rasteriser, and no GL
          # path in GStreamer, the same as the software only job below and
          # nightly. With GL live under xvfb the timing tests fail on the
          # cores the pipelines share.
          LIBGL_ALWAYS_SOFTWARE: 1
          GST_GL_DISABLED: 1
          # A shared two core runner cannot hold a 34 ms frame interval even
          # when the mixer is right. The tests print what they measured;
          # nightly runs them with no slack.
          GODWINMIX_TIMING_SLACK: 3
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a cargo test --profile ci --locked --workspace --no-fail-fast
          else
            cargo test --profile ci --locked --workspace --no-fail-fast
          fi

      # A timing test that fails dumps the pipelines it was watching to
      # target/gst-dot; kept so the log is not the only evidence.
      - name: Keep the pipeline graphs of a failed test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gst-dot-${{ matrix.os }}
          path: target/gst-dot/
          if-no-files-found: ignore

      # `cargo add godwinmix-core` has to give somebody the engine inside their
      # own program, so the example that shows it is built here. The test that
      # runs it is in the line above; this catches a missing dependency rather
      # than a missing behaviour.
      - name: The embedding example builds
        run: cargo build --release --locked -p godwinmix-core --example embed

      # The layering, checked rather than asserted in a document: the engine
      # carries no HTTP server, and the protocol carries no media stack. A
      # module put in the wrong crate fails here.
      - name: The crates stay in their layers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(cargo tree -p godwinmix-core -e normal | grep -c axum)" = 0 \
            || { echo "godwinmix-core has grown an axum dependency" >&2; exit 1; }
          test "$(cargo tree -p godwinmix-protocol -e normal | grep -c gstreamer)" = 0 \
            || { echo "godwinmix-protocol has grown a GStreamer dependency" >&2; exit 1; }

      # A second belt on the same trousers, and the one that names the problem
      # in the log rather than in a test assertion. Only where the file exists,
      # so this does not fail before --api-info lands.
      - name: protocol.json is not stale
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f protocol.json ]; then
            ./target/release/godwinmix --api-info > /tmp/protocol.json
            if ! diff -u protocol.json /tmp/protocol.json; then
              echo "protocol.json is out of date. Run: godwinmix --api-info > protocol.json" >&2
              exit 1
            fi
          else
            echo "no protocol.json in the tree yet, nothing to check"
          fi

      - name: Sidecar compiles (Windows; macOS is bundled by dev/mac-bundle.sh)
        if: runner.os == 'Windows'
        working-directory: browser
        run: cargo check --release

      # The Linux sidecar is what production runs, so it is built, not only
      # checked, and shipped in the artifact. It links libcef.so by name with an
      # $ORIGIN rpath; the CEF distribution with codecs is placed next to it.
      - name: Sidecar (Linux)
        if: runner.os == 'Linux'
        working-directory: browser
        run: cargo build --release

      - name: Desktop app dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Stage the mixer for the desktop app
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          suffix=""
          [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"
          mkdir -p tauri-app/binaries
          cp "target/release/godwinmix${suffix}" "tauri-app/binaries/godwinmix-${triple}${suffix}"

      - name: Desktop app
        working-directory: tauri-app
        run: cargo build --release --locked

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/godwinmix* dist/ 2>/dev/null || true
          cp target/release/gmx dist/ 2>/dev/null || true
          cp target/release/gmx.exe dist/ 2>/dev/null || true
          cp tauri-app/target/release/godwinmix-desktop* dist/ 2>/dev/null || true
          cp browser/target/release/godwinmix-browser dist/ 2>/dev/null || true
          rm -f dist/*.d dist/*.pdb
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: godwinmix-${{ runner.os }}
          path: dist/

  # The software path is never the path nobody ran. A GitHub Linux runner has
  # no GPU, so `hardware = "software"` is what the probe would pick anyway;
  # naming it makes the job fail loudly if a change ever starts assuming a
  # hardware element is present, instead of silently falling back.
  linux-software:
    name: linux, no GPU, software codecs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Deliberately not gstreamer1.0-vaapi and not the NVIDIA plugins. If the
      # tests need a hardware element, they fail here, which is the point.
      - name: GStreamer, software only
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools xvfb libgl1-mesa-dri

      - name: Test
        env:
          # No GL context on this runner, and no DRI device. Mesa's software
          # rasteriser is what a five year old laptop without drivers gets too.
          LIBGL_ALWAYS_SOFTWARE: 1
          GST_GL_DISABLED: 1
          # A hosted runner, so the same timing slack as the mixer jobs.
          GODWINMIX_TIMING_SLACK: 3
        run: cargo test --locked --workspace --no-fail-fast

      - name: Keep the pipeline graphs of a failed test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gst-dot-software
          path: target/gst-dot/
          if-no-files-found: ignore

      - name: What the probe picked
        run: |
          cargo build --locked
          ./target/debug/godwinmix --probe | tee probe.txt
          # Recorded in the summary so a change of default codec is visible in
          # the run rather than in someone's surprise on air.
          {
            echo '## Codecs on a machine with no GPU'
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A Raspberry Pi is a target machine in the plan, so an aarch64 build is
  # checked on every push to main. Cross compiling against GStreamer needs the
  # arm64 development packages, and getting them onto an x86 runner through
  # multiarch is more fragile than running an arm64 container under QEMU.
  # It is slow (about 20 minutes) and it is not on the pull request path.
  linux-aarch64:
    name: linux-aarch64 (QEMU)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in an arm64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" -w /src \
            -e CARGO_TERM_COLOR=always \
            rust:1-trixie \
            bash -eux -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                libgstreamer-plugins-bad1.0-dev pkg-config
              cargo build --release --locked -p godwinmix --bins
              ls -la target/release/godwinmix target/release/gmx
            '

      - name: Size of the aarch64 binary
        run: |
          size_mb=$(du -m target/release/godwinmix | cut -f1)
          echo "aarch64 core binary: ${size_mb} MB (budget: 30 MB)" >> "$GITHUB_STEP_SUMMARY"
          # A warning, not a failure, until the budget in the plan is measured
          # rather than guessed.
          if [ "$size_mb" -gt 30 ]; then
            echo "::warning::core binary is ${size_mb} MB, over the 30 MB budget"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: godwinmix-linux-aarch64
          path: |
            target/release/godwinmix
            target/release/gmx

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
      # `-D warnings` since the hardening pass: the five that had sat in
      # convert.rs, input.rs, media.rs and output.rs since the start are fixed,
      # and the count is zero. Keep it there. A lint worth disagreeing with
      # gets an `#[allow]` with a comment saying why, not a warning left in the
      # log for the next person to scroll past.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The published client libraries are generated from protocol.json. A method
  # added to the core without regenerating them fails here, in the language
  # that would have shipped stale, and the TypeScript and Python suites run
  # with nothing but their own runtimes.
  clients:
    name: clients (generated, TypeScript, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 clients/gen/generate.py --check
      # The designer kits exist three times and one file says what they answer.
      # If this fails, run `node dev/kit-fixtures.mjs` and the two suites below
      # will name the cases that moved.
      - run: node dev/kit-fixtures.mjs --check
      - run: cd clients/typescript && npm test
      - run: cd clients/python && python3 -m unittest discover -s tests -q
      - run: bash examples/test-zero-dep.sh
      # The two host specific integrations. Both run with nothing installed:
      # they import the client by path and carry their own copy of the fake
      # core, so neither needs a registry.
      - run: cd integrations/companion && npm test
      - run: cd integrations/streamdeck && npm test

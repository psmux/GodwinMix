name: sign test

# The Windows signing of a release, on a tiny program, with nothing built and
# nothing published. Push a tag such as v0.2.2-signtest.1 to run it, and
# delete the tag afterwards:
#
#   git tag v0.2.2-signtest.1 && git push origin v0.2.2-signtest.1
#   git push --delete origin v0.2.2-signtest.1 && git tag -d v0.2.2-signtest.1
#
# The tag has to start with v because the windows-signing and macos-signing
# environments only let v* tags at their secrets. release.yml and the other
# tag workflows skip v*-signtest* tags, so this is the only thing such a tag
# starts. A tag with `mac` in its name (v0.3.32-signtest-mac.1) runs only the
# macOS job, and one with `win` in it only the Windows ones.
#
# The job is a matrix in the same shape as release.yml's, with the same
# environment expression, so the Linux leg shows that a leg the expression
# leaves out gets no environment and none of its secrets.

on:
  push:
    tags: ["v*-signtest*"]

permissions:
  contents: read

jobs:
  sign:
    name: sign test (${{ matrix.os }})
    if: ${{ !contains(github.ref_name, 'mac') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: ${{ matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && 'windows-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: No environment, no secrets (Linux)
        if: runner.os == 'Linux'
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
        run: |
          if [ -n "$CERTUM_USERNAME" ]; then
            echo "::error::this leg was given the windows-signing environment"; exit 1
          fi
          echo "an empty environment expression means no environment: no secrets here"

      - uses: actions/checkout@v4
        if: runner.os == 'Windows'

      - name: TOTP against the RFC 6238 vectors
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/windows-signing/test-totp.ps1

      # Twenty copies, to time a batch the size of the release's.
      - name: A program to sign
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signtest | Out-Null
          'fn main() { println!("signed by GodwinMix"); }' | Set-Content signtest/hello.rs
          rustc -O -o signtest/hello.exe signtest/hello.rs
          if ($LASTEXITCODE -ne 0) { throw "rustc failed" }
          1..20 | ForEach-Object { Copy-Item signtest/hello.exe "signtest/batch-$_.exe" }

      - name: Log in to Certum SimplySign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_TOTP_ALGORITHM: ${{ vars.CERTUM_TOTP_ALGORITHM }}
          SIMPLYSIGN_SCREENSHOTS: ${{ runner.temp }}/simplysign
        run: ./.github/windows-signing/login.ps1

      # The batch the way the release signs staged files, then one file the
      # way Tauri's signCommand calls the script.
      - name: Sign
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = Measure-Command { ./.github/windows-signing/sign.ps1 (Get-ChildItem signtest/batch-*.exe).FullName }
          Write-Host ("20 files in {0:n1} s" -f $t.TotalSeconds)
          pwsh -NoProfile -File .github/windows-signing/sign.ps1 signtest/hello.exe
          if ($LASTEXITCODE -ne 0) { throw "sign.ps1 failed as a signCommand" }

      - name: Verify
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/windows-signing/verify.ps1 signtest/hello.exe (Get-ChildItem signtest/batch-*.exe).FullName
          $sig = Get-AuthenticodeSignature signtest/hello.exe
          Write-Host "status:      $($sig.Status)"
          Write-Host "signer:      $($sig.SignerCertificate.Subject)"
          Write-Host "issuer:      $($sig.SignerCertificate.Issuer)"
          Write-Host "timestamper: $($sig.TimeStamperCertificate.Subject)"
          & signtest/hello.exe

      - name: Log out of Certum SimplySign
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/windows-signing/logout.ps1

      # Pictures of the login window, kept a day, for when the login fails.
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: simplysign-screens
          path: ${{ runner.temp }}/simplysign
          retention-days: 1
          if-no-files-found: ignore

  # The desktop path end to end on a stand in app: the real tauri-app with a
  # small program in place of the mixer, a plugin and the browser renderer,
  # and a small library in place of GStreamer. It runs the release's own
  # steps (sign-staged.ps1, cargo tauri build with the signCommand,
  # verify-bundles.ps1), and logs in at the same moment as the job above,
  # which is what the release's two Windows jobs may do.
  installers:
    name: sign test (installers)
    if: ${{ !contains(github.ref_name, 'mac') }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment: windows-signing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app

      - name: Stand ins for what the release stages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signtest, tauri-app/plugins/camera, tauri-app/gstreamer/windows/bin | Out-Null
          'fn main() { println!("signed by GodwinMix"); }' | Set-Content signtest/hello.rs
          '#[no_mangle] pub extern "C" fn gmx_signtest() -> i32 { 7 }' | Set-Content signtest/lib.rs
          rustc -O -o signtest/hello.exe signtest/hello.rs
          rustc -O --crate-type cdylib -o signtest/gstsigntest.dll signtest/lib.rs
          $triple = (rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value
          Copy-Item signtest/hello.exe "tauri-app/binaries/godwinmix-$triple.exe"
          Copy-Item signtest/hello.exe tauri-app/plugins/camera/gmx-camera.exe
          Copy-Item signtest/hello.exe tauri-app/browser/godwinmix-browser.exe
          Copy-Item signtest/gstsigntest.dll tauri-app/gstreamer/windows/bin/

      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0" || cargo install tauri-cli --version "^2.0"

      - name: Log in to Certum SimplySign
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_TOTP_ALGORITHM: ${{ vars.CERTUM_TOTP_ALGORITHM }}
          SIMPLYSIGN_SCREENSHOTS: ${{ runner.temp }}/simplysign
        run: ./.github/windows-signing/login.ps1

      - name: Sign what the installers carry
        shell: pwsh
        run: ./.github/windows-signing/sign-staged.ps1

      - name: Bundle
        working-directory: tauri-app
        run: cargo tauri build --bundles msi,nsis ${{ env.WINDOWS_SIGN_CONFIG }}

      - name: Verify the signatures
        shell: pwsh
        run: ./.github/windows-signing/verify-bundles.ps1

      - name: Log out of Certum SimplySign
        if: always()
        shell: pwsh
        run: ./.github/windows-signing/logout.ps1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: simplysign-screens-installers
          path: ${{ runner.temp }}/simplysign
          retention-days: 1
          if-no-files-found: ignore

  # The macOS signing of a release, on a stand in app in the shape of the real
  # one: a program in Contents/MacOS that loads a library from Resources, and
  # a helper app inside it. The release's own script signs it inside out,
  # notarises and staples it, makes the disk image, notarises that, and asks
  # Gatekeeper about the app on the mounted image. Minutes, where the release
  # takes an hour to reach the same steps.
  macos:
    name: sign test (macOS)
    if: ${{ !contains(github.ref_name, 'win') }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: macos-signing
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: The secrets, the keychain and the notary key
        run: |
          ./dev/sign-macos.sh check
          ./dev/sign-macos.sh keychain
          ./dev/sign-macos.sh preflight

      - name: A stand in app
        run: |
          mkdir -p signtest && cd signtest
          app="GodwinMix Signtest.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/lib" "$app/Contents/Resources/helper"
          echo 'int gmx_signtest(void) { return 7; }' > lib.c
          printf '#include <stdio.h>\nint gmx_signtest(void);\nint main(void) { printf("signed by GodwinMix %%d\\n", gmx_signtest()); return 0; }\n' > main.c
          clang -dynamiclib -install_name @rpath/libsigntest.dylib -o "$app/Contents/Resources/lib/libsigntest.dylib" lib.c
          clang -o "$app/Contents/MacOS/signtest" main.c -L"$app/Contents/Resources/lib" -lsigntest \
            -Wl,-rpath,@executable_path/../Resources/lib
          plist() {
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string $2" -c "Add :CFBundleIdentifier string $3" \
              -c "Add :CFBundlePackageType string APPL" -c "Add :CFBundleShortVersionString string 0.0.1" "$1"
          }
          plist "$app/Contents/Info.plist" signtest mix.godwin.signtest
          helper="$app/Contents/Resources/helper/Signtest Helper.app"
          mkdir -p "$helper/Contents/MacOS"
          clang -o "$helper/Contents/MacOS/helper" main.c -L"$app/Contents/Resources/lib" -lsigntest \
            -Wl,-rpath,@executable_path/../../../../lib
          plist "$helper/Contents/Info.plist" helper mix.godwin.signtest.helper
          clang -o loose main.c -L"$app/Contents/Resources/lib" -lsigntest -Wl,-rpath,@executable_path/"$app"/Contents/Resources/lib

      - name: Sign, notarise and staple the app
        working-directory: signtest
        run: |
          ../dev/sign-macos.sh sign "GodwinMix Signtest.app"
          ../dev/sign-macos.sh verify "GodwinMix Signtest.app"
          ../dev/sign-macos.sh notarize "GodwinMix Signtest.app"
          "GodwinMix Signtest.app/Contents/MacOS/signtest"

      - name: The disk image, notarised, and Gatekeeper's verdict on the app on it
        working-directory: signtest
        run: |
          ../dev/sign-macos.sh dmg "GodwinMix Signtest.app" signtest.dmg
          ../dev/sign-macos.sh notarize signtest.dmg
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" signtest.dmg >/dev/null
          verdict=$(spctl -a -vv -t exec "$mnt/GodwinMix Signtest.app" 2>&1 || true)
          hdiutil detach "$mnt" >/dev/null
          echo "$verdict"
          grep -q 'source=Notarized Developer ID' <<<"$verdict" \
            || { echo "::error::Gatekeeper does not accept the app on the disk image as notarised"; exit 1; }

      - name: A loose program, the way the core archive is done
        working-directory: signtest
        run: |
          ../dev/sign-macos.sh sign loose
          ../dev/sign-macos.sh verify loose
          zip -q loose.zip loose
          ../dev/sign-macos.sh notarize loose.zip
          ./loose

      - name: Remove the signing keychain
        if: always()
        run: ./dev/sign-macos.sh cleanup

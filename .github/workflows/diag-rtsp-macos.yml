name: diag rtsp macos
on:
  push:
    branches: [fix/rtsp-macos-decode]
jobs:
  loop:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GStreamer
        run: |
          brew install gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Which H.264 decoders
        run: gst-inspect-1.0 | grep -iE 'h264|vtdec' || true
      - name: Build
        run: cargo test --profile ci -p gmx-rtsp --no-run
      - name: Loop, keep every failure whole
        env:
          GST_GL_DISABLED: 1
          RUST_TEST_THREADS: 2
        run: |
          for i in $(seq 1 30); do
            start=$(date +%s)
            if cargo test --profile ci -p gmx-rtsp -- --nocapture tests::uridecodebin > run.log 2>&1; then
              echo "run $i ok in $(( $(date +%s) - start )) s: $(grep 'uridecodebin decoded' run.log)"
            else
              echo "run $i FAILED in $(( $(date +%s) - start )) s"; cat run.log
            fi
          done

name: diag rtsp macos
on:
  push:
    branches: [fix/rtsp-macos-decode]
jobs:
  loop:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GStreamer
        run: |
          brew install gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Which H.264 decoders
        run: gst-inspect-1.0 | grep -iE 'h264|vtdec' || true
      - name: Build
        run: cargo test --profile ci -p gmx-rtsp --no-run
      - name: Loop, as CI runs it
        env:
          GST_GL_DISABLED: 1
          LIBGL_ALWAYS_SOFTWARE: 1
          RUST_TEST_THREADS: 2
        run: |
          for i in $(seq 1 12); do
            cargo test --profile ci -p gmx-rtsp -- --nocapture tests::uridecodebin 2>&1 | grep -E 'uridecodebin decoded|test result|panicked' | sed "s/^/run $i: /"
          done
      - name: Loop with VideoToolbox decoding off
        env:
          GST_GL_DISABLED: 1
          RUST_TEST_THREADS: 2
          GST_PLUGIN_FEATURE_RANK: vtdec:NONE,vtdec_hw:NONE
        run: |
          for i in $(seq 1 6); do
            cargo test --profile ci -p gmx-rtsp -- --nocapture tests::uridecodebin 2>&1 | grep -E 'uridecodebin decoded|test result|panicked' | sed "s/^/off $i: /"
          done

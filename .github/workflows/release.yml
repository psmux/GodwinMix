name: release

# Everything a `v*` tag has to produce, in one workflow:
#
#   * the core binaries per platform, as an archive, with the `gmx` alias in it
#   * the desktop app as .app (and .dmg), .msi and .deb
#   * SHA256SUMS over all of it
#   * the container image on GHCR
#
# The release itself is created only after every build job has finished, so
# nobody downloads half a release while the Windows job is still running.

on:
  push:
    tags: ["v*"]
  # For rehearsing the whole thing without cutting a tag. Produces artifacts
  # and an image tagged with the commit, and no GitHub release.
  workflow_dispatch:

permissions:
  contents: write   # create the release and attach assets
  packages: write   # push the image to GHCR

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------- binaries --
  core:
    name: core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2

      - name: GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev

      - name: GStreamer (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      # The official full installer, not chocolatey's package: that one is
      # 1.26 with the typical feature set, which has no SRT, and the
      # installers built from it went out without it. See the script.
      - name: GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/install-gstreamer-windows.ps1

      - name: Build
        run: cargo build --release --locked --bins

      # Both binaries go in the archive. They are the same code under two
      # names: `godwinmix` is what a service unit and a package call it, `gmx`
      # is what an operator types.
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          name="godwinmix-${version}-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/godwinmix.exe target/release/gmx.exe "pkg/$name/"
          else
            cp target/release/godwinmix target/release/gmx "pkg/$name/"
          fi
          cp README.md LICENSE godwinmix.example.toml "pkg/$name/"
          cd pkg
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$name.zip" "$name" > /dev/null
          else
            tar czf "../$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  # A Raspberry Pi and any arm64 server. Built in an arm64 container under
  # QEMU rather than cross compiled, because getting the arm64 GStreamer
  # development packages onto an x86 runner through multiarch is the more
  # fragile of the two. It takes about twenty minutes and it is the reason a
  # Pi user can install from a release instead of compiling on the board.
  core-aarch64:
    name: core (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" -w /src -e CARGO_TERM_COLOR=always \
            rust:1-trixie \
            bash -eux -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev pkg-config
              cargo build --release --locked --bins
              strip target/release/godwinmix target/release/gmx
            '

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          name="godwinmix-${version}-aarch64-unknown-linux-gnu"
          mkdir -p "pkg/$name"
          sudo cp target/release/godwinmix target/release/gmx "pkg/$name/"
          cp README.md LICENSE godwinmix.example.toml deploy/systemd/godwinmix.service "pkg/$name/"
          sudo chown -R "$USER" pkg
          tar czf "$name.tar.gz" -C pkg "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: core-aarch64-unknown-linux-gnu
          path: "*.tar.gz"

  # ---------------------------------------------------------------- desktop --
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bundles: deb,appimage
          - os: macos-latest
            platform: macos
            bundles: app
          - os: windows-latest
            platform: windows
            bundles: msi,nsis
    env:
      # The Windows installer. 09-builders set 150 MB, against the 527 MB the
      # stock GStreamer runtime installer costs on its own and the 160 MB OBS
      # ships self contained. That was before web pages and every plugin
      # travelled inside it: a person who installs GodwinMix must be able to
      # add a YouTube page or an SRT feed without fetching anything. Measured
      # on 2026-10-03 with all of it in: 158 MB for the NSIS .exe and 224 MB
      # for the .msi, whose cabinet compresses Chromium less well. A release
      # that breaks this does not get published.
      # Raised to 300 on 2026-10-04 for the person cutout: ONNX Runtime with
      # DirectML (35 MB) and its two models (13 MB) take the .msi from 236 MB
      # to about 265. The NSIS .exe stays near 185.
      WINDOWS_INSTALLER_BUDGET_MB: 300
      # 133.5 MB on Windows on 2026-10-03 once every first party plugin's
      # elements were kept (WHIP, NDI and DeckLink had been trimmed away).
      RUNTIME_BUDGET_MB: 160
      # The three device plugins together, measured at 4 MB on macOS. A
      # tripwire rather than a tight budget: what fills the installer is
      # GStreamer, and these three have no business growing to twenty.
      PLUGINS_BUDGET_MB: 20
      # Every other plugin this platform runs, installed on first use. 33 MB
      # on Windows on 2026-10-03; the same tripwire kind of number.
      ON_DEMAND_PLUGINS_BUDGET_MB: 80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app

      # The desktop shell is a webview pointed at the mixer's own URL, so it
      # does not link GStreamer. It does need the platform's webview toolkit,
      # and it needs a GStreamer to cut the bundled runtime out of.
      - name: Tauri dependencies and GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libfuse2 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-tools

      - name: GStreamer (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      # The official full installer, not chocolatey's package: that one is
      # 1.26 with the typical feature set, which has no SRT, and the
      # installers built from it went out without it. See the script.
      - name: GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/install-gstreamer-windows.ps1

      # The mixer travels inside the app as a sidecar, named for the triple it
      # was built on, which is how Tauri finds it.
      - name: The mixer, as a sidecar
        shell: bash
        run: |
          cargo build --release --locked --bin godwinmix
          triple=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/godwinmix.exe "tauri-app/binaries/godwinmix-${triple}.exe"
          else
            cp target/release/godwinmix "tauri-app/binaries/godwinmix-${triple}"
          fi

      # The NDI SDK, for the one file of it the installer carries: the runtime
      # DLL and its licence notices, copied beside the ndi plugin by
      # bundle-plugins.sh. The SDK's terms allow that when the application's
      # own licence carries the NDI end user terms, which windows-licence.txt
      # does, and a link to ndi.video sits wherever NDI is picked.
      #
      # Unpacked with innoextract, not run: the SDK's installer, even with
      # /VERYSILENT, sat on a runner for two hours until the job timed out.
      - name: NDI SDK (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          Invoke-WebRequest "https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip" -OutFile "$tmp\innoextract.zip"
          $sum = (Get-FileHash "$tmp\innoextract.zip" -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne "6989342c9b026a00a72a38f23b62a8e6a22cc5de69805cf47d68ac2fec993065") { throw "innoextract.zip has sha256 $sum" }
          Expand-Archive "$tmp\innoextract.zip" "$tmp\innoextract"
          Invoke-WebRequest "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe" -OutFile "$tmp\ndi-sdk.exe"
          & "$tmp\innoextract\innoextract.exe" -s -e -d "$tmp\ndi-sdk" "$tmp\ndi-sdk.exe"
          $dir = "$tmp\ndi-sdk\app"
          if (-not (Test-Path "$dir\Bin\x64\Processing.NDI.Lib.x64.dll")) { throw "the NDI SDK did not unpack to $dir" }
          "NDI_SDK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The camera, the screen and the microphone, staged the way the core
      # expects to find an installed plugin. Without this step the app goes out
      # with no way to add a source that is not a file or a URL, and the
      # operator is back in a terminal running `gmx plugin add camera`.
      - name: The device plugins, inside the app
        shell: bash
        run: |
          ./dev/bundle-plugins.sh --budget-mb "$PLUGINS_BUDGET_MB"
          # The rest, staged as plugins/<name> beside the mixer, where it finds
          # a first party plugin the first time somebody picks its feature.
          # Nothing of theirs runs until then.
          ./dev/bundle-plugins.sh --on-demand --budget-mb "$ON_DEMAND_PLUGINS_BUDGET_MB"

      # The browser renderer, so a web page works in the installed app with
      # nothing built on the operator's machine. On every platform: on Windows
      # too since the renderer carries the manifest Chromium needs there, and
      # the budget above was measured with it in.
      - name: The browser renderer, inside the app
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) brew install cmake ninja ;;
            # choco puts cmake on the machine PATH, which this step does not
            # see until the next one.
            Windows) choco install -y --no-progress cmake ninja
                     export PATH="/c/Program Files/CMake/bin:$PATH" ;;
            *) sudo apt-get install -y cmake ninja-build ;;
          esac
          ./dev/bundle-browser.sh

      # The trimmed runtime, which tauri.conf.json lists under
      # bundle.resources. Without this step the installers go out expecting
      # the operator to install a 527 MB GStreamer first, which is the thing
      # this whole arrangement exists to avoid.
      - name: Build private FFmpeg for the Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev meson ninja-build nasm zlib1g-dev libbz2-dev liblzma-dev
          ./dev/build-linux-libav.sh "$RUNNER_TEMP/gst-prefix"

      - name: The bundled GStreamer (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            ./dev/bundle-gstreamer.sh --from "$RUNNER_TEMP/gst-prefix" --budget-mb "$RUNTIME_BUDGET_MB"
          else
            ./dev/bundle-gstreamer.sh --budget-mb "$RUNTIME_BUDGET_MB"
          fi

      - name: The bundled GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/bundle-gstreamer.ps1 -BudgetMb ([double]$env:RUNTIME_BUDGET_MB)

      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0" || cargo install tauri-cli --version "^2.0"

      # `cargo tauri build`, not `cargo build`: the plain build produces a bare
      # executable and no installer, which is what the old workflow did and why
      # there has never been a .msi or a .deb to download.
      # The mixer was linked against Homebrew's GStreamer. Inside the app it
      # must load the copy in Resources whoever starts it: the app sets
      # DYLD_LIBRARY_PATH, an AI agent running `godwinmix mcp` does not. Each
      # library the trimmed tree carries is pointed at by its path in the app.
      - name: The mixer loads the runtime inside the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          bin="tauri-app/binaries/godwinmix-${triple}"
          lib=tauri-app/gstreamer/macos/lib
          otool -L "$bin" | awk 'NR>1 {print $1}' | while read -r dep; do
            leaf="${dep##*/}"
            if [ -f "$lib/$leaf" ]; then
              install_name_tool -change "$dep" "@executable_path/../Resources/gstreamer/macos/lib/$leaf" "$bin"
            fi
          done
          codesign --force --sign - "$bin"
          otool -L "$bin" | grep -c "@executable_path"             || { echo "::error::nothing in the mixer pointed at the runtime in the app" >&2; exit 1; }

      # The person cutout: its two Apache 2.0 models and ONNX Runtime for this
      # platform (DirectML inside on Windows, CoreML on macOS), pinned and
      # checked. Resources of the app, beside the mixer, where it looks.
      - name: The cutout models and runtime, inside the app
        shell: bash
        run: bash dev/fetch-models.sh --models tauri-app/models --runtime tauri-app/onnxruntime

      - name: Bundle
        working-directory: tauri-app
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      # The .app is built above and the .dmg wraps it here, on its own, because
      # the dmg step drives `bundle_dmg.sh`, which asks Finder over AppleScript
      # to arrange the disk image window and times out with
      # `AppleEvent timed out (-1712)` on a machine with no automation
      # permission, which a CI runner is. tauri-bundler passes
      # `--skip-jenkins` to skip that when `CI` is `true`. GitHub sets `CI`
      # already; setting it here is what makes the reason readable, and what
      # makes this step work when somebody runs the workflow locally with act.
      - name: The disk image (macOS)
        if: runner.os == 'macOS'
        working-directory: tauri-app
        env:
          CI: "true"
        # `app` as well, or tauri-bundler deletes the .app it made the disk
        # image from, and the check below and the collect step find nothing.
        run: cargo tauri build --bundles app,dmg

      # An installer with no media stack inside it is the failure this release
      # is meant to make impossible, so the bundle is opened and looked at.
      - name: The runtime really is inside the app (macOS)
        if: runner.os == 'macOS'
        run: |
          app=tauri-app/target/release/bundle/macos/GodwinMix.app
          test -d "$app/Contents/Resources/gstreamer" \
            || { echo "::error::no gstreamer in $app" >&2; exit 1; }
          find "$app/Contents/Resources/plugins" -name gmx-camera -type f | grep -q . \
            || { echo "::error::no camera plugin in $app" >&2; exit 1; }
          # Without this key macOS does not refuse the camera, it kills the
          # process that asked for it, and the operator gets a source that
          # will not go live and a log that stops mid sentence.
          grep -q NSCameraUsageDescription "$app/Contents/Info.plist" \
            || { echo "::error::tauri-app/Info.plist was not merged into $app" >&2; exit 1; }
          # --headless-check asks the mixer it starts whether it loaded each
          # of them, which is the claim that matters.
          ./"$app"/Contents/MacOS/godwinmix-desktop --headless-check
          # And the mixer on its own, as an AI agent starts it: no desktop
          # app, no variables, nothing from Homebrew on the path.
          env -i HOME="$HOME" "$app/Contents/MacOS/godwinmix" codec list | head -5

      - name: Sizes, against the budget
        shell: bash
        run: |
          budget=0
          [ "${{ runner.os }}" = "Windows" ] && budget="$WINDOWS_INSTALLER_BUDGET_MB"
          failed=0
          printf '### %s\n\n| artefact | size |\n|---|---|\n' "${{ matrix.platform }}" \
            >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r file; do
            size_mb=$(du -m "$file" | cut -f1)
            name=$(basename "$file")
            echo "| $name | ${size_mb} MB |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$budget" -gt 0 ] && [ "$size_mb" -gt "$budget" ]; then
              echo "::error::$name is ${size_mb} MB, over the ${budget} MB budget"
              failed=1
            fi
          done < <(find tauri-app/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.dmg' \) )
          exit $failed

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p bundles
          find tauri-app/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' \
               -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} bundles/ \;
          # The .app is a directory, so it travels as an archive.
          if [ -d tauri-app/target/release/bundle/macos ]; then
            version="${GITHUB_REF_NAME#v}"
            (cd tauri-app/target/release/bundle/macos && tar czf "$GITHUB_WORKSPACE/bundles/GodwinMix-${version}-macos.app.tar.gz" GodwinMix.app)
          fi
          ls -la bundles

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: bundles/

  # ----------------------------------------------------------------- image ---
  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves only on a tag, never on a manual run, so a rehearsal
      # cannot become the image people pull.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------- release ---
  publish:
    name: publish the release
    needs: [core, core-aarch64, desktop, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # By name, not everything the run uploaded: the image job's build
      # action uploads a `.dockerbuild` record of its own, which is no part of
      # the release, and failing to download it failed the first release.
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: core-*

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: desktop-*

      - name: One directory, one checksum file
        run: |
          mkdir -p assets
          find incoming -type f -exec cp {} assets/ \;
          cd assets
          # One file, every asset, so a download can be checked with a single
          # `sha256sum -c SHA256SUMS` after fetching the ones you want.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The image is pushed under the repository's name in lower case, which
      # is the only case a registry takes; `docker run` with the name as
      # written on GitHub is refused.
      - name: The image's name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # The image is tagged by semver without the tag's leading v.
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          draft: false
          generate_release_notes: true
          body: |
            ## Install

            Docker, which carries its own GStreamer:

                docker run -d --name godwinmix -p 127.0.0.1:8080:8080 \
                  -e GODWINMIX_TOKEN=change-me ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}

            Desktop: the `.dmg` on macOS; the `-setup.exe` or the `.msi` on
            Windows; the `.deb` on Debian and Ubuntu, or the `.AppImage` on any
            other Linux. Each carries its own trimmed GStreamer, so nothing
            else needs installing (see the README, Platforms).

            Server: the archive for your platform holds `godwinmix` and `gmx`,
            the same binary under two names, plus the example config. The
            distribution's GStreamer packages are the only dependency.

            Check what you downloaded against `SHA256SUMS`.

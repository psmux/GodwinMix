name: platforms

# Diagnostic only, on diag/flaky-* branches: each flaky test run many times
# on the platform where it failed, odd runs alone and even runs beside two
# busy cores, with the station's log kept when a run fails.

on:
  push:
    branches: ["diag/flaky-**"]

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  GODWINMIX_TIMING_SLACK: 3
  LIBGL_ALWAYS_SOFTWARE: 1
  GST_GL_DISABLED: 1

jobs:
  flaky:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: restart-linux
            os: ubuntu-26.04
            build: "-p godwinmix --test station"
            test: "-p godwinmix --test station -- --nocapture direct_restart::"
            ingest: true
            n: 16
          - name: collab-linux
            os: ubuntu-26.04
            build: "-p godwinmix --test collab"
            test: "-p godwinmix --test collab -- --nocapture two_people_on_one_token"
            n: 30
          - name: pool-macos
            os: macos-latest
            build: "-p godwinmix-core --lib"
            test: "-p godwinmix-core --lib -- --nocapture mixer::tests::full_pool"
            n: 30
          - name: pool-windows
            os: windows-latest
            build: "-p godwinmix-core --lib"
            test: "-p godwinmix-core --lib -- --nocapture mixer::tests::full_pool"
            n: 30
          - name: governor-macos
            os: macos-latest
            build: "-p godwinmix --test station"
            test: "-p godwinmix --test station -- --nocapture direct_live::governor_status_counts"
            ingest: true
            n: 12
          - name: rtsp-windows
            os: windows-latest
            build: "-p godwinmix-core --lib"
            test: "-p godwinmix-core --lib -- --nocapture --test-threads 1 mixer::tests::replug::an_rtsp mixer::tests::rtsp_live"
            n: 16
          - name: srt-windows
            os: windows-latest
            build: "-p gmx-ingest --bin gmx-ingest"
            test: "-p gmx-ingest --bin gmx-ingest -- --nocapture srt::tests::a_player_on_the_publishers_port"
            n: 20
          - name: direct-live-windows
            os: windows-latest
            build: "-p godwinmix --test station"
            test: "-p godwinmix --test station -- --nocapture direct_live::a_direct_show_carries"
            ingest: true
            n: 16
          - name: catch-up-windows
            os: windows-latest
            build: "-p godwinmix-core --test catch_up"
            test: "-p godwinmix-core --test catch_up -- --nocapture"
            n: 20
          - name: framebus-linux
            os: ubuntu-26.04
            build: "-p godwinmix-framebus --test failures"
            test: "-p godwinmix-framebus --test failures -- --nocapture"
            n: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-flaky-${{ matrix.os }}
      - name: GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools \
            gstreamer1.0-nice libssl-dev xvfb
      - name: GStreamer (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gstreamer libnice-gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GMX_CODEC_DISABLE=h264-videotoolbox,h265-videotoolbox,h264-videotoolbox-any" >> "$GITHUB_ENV"
      - name: GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/install-gstreamer-windows.ps1
      - name: Build
        shell: bash
        run: |
          cargo build --profile ci --locked -p godwinmix --bins
          if [ "${{ matrix.ingest }}" = true ]; then cargo build --profile ci --locked -p gmx-ingest; fi
          cargo test --profile ci --locked ${{ matrix.build }} --no-run
      - name: Many runs
        shell: bash {0}
        run: |
          busy() { for _ in 1 2; do ( while :; do :; done ) >/dev/null 2>&1 & echo $!; done; }
          tmp="${TMPDIR:-${TEMP:-/tmp}}"
          pass=0; fail=0; n=${{ matrix.n }}
          for i in $(seq 1 $n); do
            load=""; pids=""
            if [ $((i % 2)) = 0 ]; then pids=$(busy); load="beside two busy cores"; fi
            start=$(date +%s)
            if [ "${{ runner.os }}" = Linux ]; then
              xvfb-run -a cargo test --profile ci --locked ${{ matrix.test }} > run.log 2>&1; code=$?
            else
              cargo test --profile ci --locked ${{ matrix.test }} > run.log 2>&1; code=$?
            fi
            [ -n "$pids" ] && kill $pids
            took=$(( $(date +%s) - start ))
            if [ $code = 0 ]; then pass=$((pass+1)); echo "run $i ok in ${took} s $load"; else fail=$((fail+1)); echo "run $i FAILED in ${took} s $load"; fi
            grep -aE 'panicked|assertion|had 50 kB|had 20 kB|refused|skipping|caught up|placed|left live|presence|test result' run.log | cut -c1-1500 | head -20
            if [ $code != 0 ]; then
              for log in $(ls -d /tmp/gmx-station-test-* "$tmp"/gmx-station-test-* 2>/dev/null); do
                [ -f "$log/log.jsonl" ] || continue
                echo "--- $log/log.jsonl, the input, outputs and plans"
                grep -aiE 'ingest|direct|input|rendition|plan|sending|nothing|session|stall' "$log/log.jsonl" | cut -c1-600 | tail -120
              done
            fi
            rm -rf /tmp/gmx-station-test-* "$tmp"/gmx-station-test-* 2>/dev/null
          done
          echo "passed $pass of $n"
          [ $fail = 0 ]

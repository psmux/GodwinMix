name: platforms

# Diagnostic only, on diag/* branches: two macOS flakes run many times each,
# alone and beside two cores of busy work, the way the full suite loads the
# runner.

on:
  push:
    branches: ["diag/mac-flakes**"]

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  GODWINMIX_TIMING_SLACK: 3
  LIBGL_ALWAYS_SOFTWARE: 1
  GST_GL_DISABLED: 1
  GMX_CODEC_DISABLE: h264-videotoolbox,h265-videotoolbox,h264-videotoolbox-any

jobs:
  flakes:
    name: ${{ matrix.which }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        which: [governor]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The input as it was before the fix
        if: matrix.which == 'restart-before'
        run: git checkout 84f85553 -- plugins/ingest/src/direct/input/runner.rs plugins/ingest/src/direct/input/loss.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: platforms-macos
          save-if: false
      - name: GStreamer (macOS)
        run: |
          brew install gstreamer libnice-gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cargo build --profile ci --locked -p godwinmix -p gmx-ingest --bins
          cargo test --profile ci --locked -p gmx-ingest --bin gmx-ingest --no-run
          cargo test --profile ci --locked -p godwinmix --test station --no-run
      - name: Many runs
        shell: bash {0}
        run: |
          if [ "${{ matrix.which }}" != governor ]; then
            cmd=(cargo test --profile ci --locked -p gmx-ingest --bin gmx-ingest -- --nocapture direct::input::tests::restart)
            n=16
          else
            cmd=(cargo test --profile ci --locked -p godwinmix --test station -- --nocapture direct_live::governor_status_counts)
            n=6
          fi
          pass=0; fail=0
          for i in $(seq 1 $n); do
            load=""
            if [ $((i % 2)) = 0 ]; then yes > /dev/null & y1=$!; yes > /dev/null & y2=$!; load="beside two busy cores"; fi
            start=$(date +%s)
            "${cmd[@]}" > run.log 2>&1; code=$?
            [ -n "$load" ] && kill $y1 $y2
            took=$(( $(date +%s) - start ))
            if [ $code = 0 ]; then pass=$((pass+1)); echo "run $i ok in ${took} s $load"; else fail=$((fail+1)); echo "run $i FAILED in ${took} s $load"; fi
            grep -aE 'panicked|measures|millicores|is sending|nothing (from|arrived)|frames after|test result|^ *[0-9]+ +[0-9]+ +[0-9.]+ ' run.log | cut -c1-400 | head -30
          done
          echo "passed $pass of $n"
          [ $fail = 0 ]

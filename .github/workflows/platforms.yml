name: platforms

# Diagnostic only, on diag/flaky-* branches: each flaky test run many times
# on the platform where it failed, odd runs alone and even runs beside a
# busy loop on every core, with what each run printed kept when it fails.

on:
  push:
    branches: ["diag/flaky-**"]

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  GODWINMIX_TIMING_SLACK: 3
  LIBGL_ALWAYS_SOFTWARE: 1
  GST_GL_DISABLED: 1

jobs:
  flaky:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: replug-windows
            os: windows-latest
            build: "-p godwinmix-core --lib"
            test: "-p godwinmix-core --lib -- --nocapture mixer::tests::replug::an_rtsp"
            n: 20
          - name: replug-macos
            os: macos-latest
            build: "-p godwinmix-core --lib"
            test: "-p godwinmix-core --lib -- --nocapture mixer::tests::replug::an_rtsp"
            n: 24
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-flaky-${{ matrix.os }}
      - name: GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools \
            gstreamer1.0-nice libssl-dev xvfb
      - name: GStreamer (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gstreamer libnice-gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GMX_CODEC_DISABLE=h264-videotoolbox,h265-videotoolbox,h264-videotoolbox-any" >> "$GITHUB_ENV"
      - name: GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/install-gstreamer-windows.ps1
      - name: Build
        shell: bash
        run: |
          cargo build --profile ci --locked -p godwinmix --bins
          if [ "${{ matrix.ingest }}" = true ]; then cargo build --profile ci --locked -p gmx-ingest; fi
          cargo test --profile ci --locked ${{ matrix.build }} --no-run
      - name: Many runs
        shell: bash {0}
        run: |
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          busy() { for _ in $(seq 1 "$cores"); do ( while :; do :; done ) >/dev/null 2>&1 & echo $!; done; }
          tmo() { if command -v timeout >/dev/null; then timeout 600 "$@"; else "$@"; fi; }
          tmp="${TMPDIR:-${TEMP:-/tmp}}"
          pass=0; fail=0; n=${{ matrix.n }}
          for i in $(seq 1 $n); do
            load=""; pids=""
            if [ $((i % 2)) = 0 ]; then pids=$(busy); load="beside $cores busy cores"; fi
            start=$(date +%s)
            if [ "${{ runner.os }}" = Linux ]; then
              tmo xvfb-run -a cargo test --profile ci --locked ${{ matrix.test }} > run.log 2>&1; code=$?
            else
              tmo cargo test --profile ci --locked ${{ matrix.test }} > run.log 2>&1; code=$?
            fi
            [ -n "$pids" ] && kill $pids
            took=$(( $(date +%s) - start ))
            if [ $code = 0 ]; then pass=$((pass+1)); echo "run $i ok in ${took} s $load"; else fail=$((fail+1)); echo "run $i FAILED with exit code $code in ${took} s $load"; fi
            grep -aE 'kB again|refused the|skipping|caught up by|ms ahead|test result|exit code|STATUS_|FAILED' run.log | cut -c1-900 | head -20
            if [ $code != 0 ]; then
              echo "--- what the failing run said"
              grep -aE -A3 'panicked|ms ahead' run.log | cut -c1-2500 | head -40
              grep -aE 'source=far|far:|cam|rtsp|aligned|timeline|caught|catch|stall|restart|live' run.log | grep -avE 'preview|multiview' | cut -c1-400 | tail -200
              tail -n 5 run.log | cut -c1-600
              for log in $(ls -d /tmp/gmx-station-test-* "$tmp"/gmx-station-test-* 2>/dev/null); do
                [ -f "$log/log.jsonl" ] || continue
                echo "--- $log/log.jsonl, the input, outputs and plans"
                grep -aiE 'ingest|direct|input|rendition|plan|sending|nothing|session|stall|refus|admit' "$log/log.jsonl" | cut -c1-600 | tail -200
              done
            fi
            ps -eo pid,ppid,pcpu,etime,args 2>/dev/null | grep -iE 'gmx|godwinmix' | grep -v grep | cut -c1-200 | head -10
            rm -rf /tmp/gmx-station-test-* "$tmp"/gmx-station-test-* 2>/dev/null
          done
          echo "passed $pass of $n"
          [ $fail = 0 ]

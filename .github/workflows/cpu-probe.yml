name: cpu probe
on:
  push:
    branches: [diag/cpu-baseline]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Before
        run: dpkg-query -W -f='${Architecture-Variant}\n' | sort | uniq -c
      - uses: ./.github/actions/amd64-baseline
      - name: After
        run: |
          dpkg-query -W -f='${Architecture-Variant}\n' | sort | uniq -c
          dpkg-query -W -f='${binary:Package} ${Architecture-Variant}\n' | awk '$2 == "amd64v3"' | head -40

name: pcm diag

# A temporary look at why the soak's PCM stream sometimes gets no frame for
# twenty seconds, on the fix/soak-growth branch only. Three full soaks side by
# side; a stream that fails saves the programme's graph while it waits, and the
# soak's whole working directory is kept.

on:
  push:
    branches: [fix/soak-growth]
    paths: [".github/workflows/pcm-diag.yml"]

jobs:
  soak:
    name: pcm ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools
      - name: Build
        run: cargo build --release --locked
      - name: Soak
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GST_GL_DISABLED: "1"
          GODWINMIX_SOAK_BIN_DIR: ${{ github.workspace }}/target/release
        run: |
          mkdir -p diag
          dev/soak.sh --minutes 45 --machine "pcm-${{ matrix.n }}" --keep 2>&1 | tee diag/soak.log || true
          w="$(ls -d /tmp/gmx-soak.* | head -1)"
          cp "$w"/core.log "$w"/streams-round-* diag/ 2>/dev/null || true
          cp bench/results/soak-pcm-*.json diag/ 2>/dev/null || true
          ls -la diag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcm-${{ matrix.n }}
          path: diag/
          retention-days: 7

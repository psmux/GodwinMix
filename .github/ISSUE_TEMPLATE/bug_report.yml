name: Bug report
description: Something the mixer did that it should not have done
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        First response on an issue is targeted at under 48 hours. If three days
        pass with nothing, assume it was missed and say so on the thread.

        Do not report a security problem here. See
        [SECURITY.md](https://github.com/psmux/GodwinMix/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
      placeholder: |
        Took cam2 while an ad break was running and the programme went black
        for about a second. I expected the ad to finish and the take to land
        after it.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        The steps, and the config if it matters. If it happens once in twenty
        times, say that; an intermittent bug that is reported as intermittent
        is much easier to find than one reported as certain.
      placeholder: |
        1. gmx ctl source add cam1 rtmp://...
        2. gmx ctl ad /srv/ads/spot.mp4
        3. gmx ctl take cam2 while the ad is playing
    validations:
      required: true

  - type: textarea
    id: bundle
    attributes:
      label: Support bundle
      description: |
        `gmx support-bundle` is planned and does not exist yet. Until it does,
        the same information by hand, with anything private removed:

        ```sh
        godwinmix --version
        godwinmix --probe
        gmx ctl status
        journalctl -u godwinmix -n 500      # or: docker logs godwinmix 2>&1 | tail -500
        ```

        Paste the output, or attach it as a file. Remove your stream keys and
        your control token before you paste; nothing else in there is secret.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `godwinmix --version`, or the image tag.
      placeholder: "0.2.0, or ghcr.io/psmux/godwinmix:latest pulled today"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (distribution packages)
        - Linux (the Docker image)
        - macOS
        - Windows
        - Raspberry Pi
        - Something else, described below
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Encoder and decoder
      description: The `backend` block from `gmx ctl status`, or the line from `--probe`.
      placeholder: "nvh264dec / nvh264enc, hardware_accelerated: true"

  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I removed my stream keys and control token from everything I pasted
          required: true
        - label: I checked the known limitations in the README
          required: false

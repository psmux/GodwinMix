# The programme's public player. A page of ours, because Cloudflare's Rocket
# Loader rewrites the inline script of mediamtx's built-in page; scripts marked
# data-cfasync="false" are left alone. The HLS is plain files written by the
# hls service. Playlists must never be cached (Cloudflare caches what the
# origin allows, and this zone caches generously); segments are named uniquely
# and may be.
server {
    listen 80;
    root /usr/share/nginx/html;
    location = / { try_files /index.html =404; }
    location ~ ^/hls/.*\.m3u8$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { application/vnd.apple.mpegurl m3u8; }
    }
    location ~ ^/hls/.*\.ts$ {
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { video/mp2t ts; }
    }
}

# The programme's public player. A page of ours, because Cloudflare's Rocket
# Loader rewrites the inline script of mediamtx's built-in page; scripts marked
# data-cfasync="false" are left alone. The HLS is plain files written by the
# hls service. Nothing here may be cached except segments: Cloudflare caches
# what the origin allows and this zone caches generously, and a cached copy of
# the page or of a playlist is a player that never starts or never advances.
server {
    listen 80;
    root /usr/share/nginx/html;
    location = / { add_header Cache-Control "no-store" always; try_files /index.html =404; }
    location = /watch { add_header Cache-Control "no-store" always; default_type text/html; alias /usr/share/nginx/html/index.html; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    # The player library, under the name the page uses and the name an older
    # copy of the page used.
    location = /hls.min.js { add_header Cache-Control "no-store" always; alias /usr/share/nginx/html/hls-1.5.min.js; }
    location = /hls-1.5.min.js { add_header Cache-Control "no-store" always; }
    location ~ ^/hls/.*\.m3u8$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { application/vnd.apple.mpegurl m3u8; }
    }
    location ~ ^/hls/.*\.ts$ {
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { video/mp2t ts; }
    }
}

# The mixer's UI and API for the outside, on 81: a proxy that tells Cloudflare
# to leave the page alone. Without no-transform Cloudflare injects Rocket
# Loader into the UI, which defers its inline script, and the page paints once
# and dies; and it cached the page for half an hour. The WebSocket carries the
# state and the mosaic, so the upgrade headers pass through.
server {
    listen 81;
    # No caching and no rewriting anywhere on this host (see above).
    add_header Cache-Control "no-store, no-transform" always;
    # One link that signs a browser in: /login?token=... stores the token
    # where the UI looks for it and opens the UI. A wrong token typed into
    # the UI's prompt is discarded by the UI and then it retries without one
    # for ever; this replaces the typing.
    location = /login {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>LiveboxMix sign in</title><body style="font:16px system-ui;padding:2em"><p id="m">Signing in…</p><script data-cfasync="false">var t=new URLSearchParams(location.search).get("token");if(t){try{localStorage.setItem("lbx.token",t.trim());}catch(e){}location.replace("/");}else{document.getElementById("m").textContent="Open this page as /login?token=YOUR_TOKEN";}</script></body>';
    }
    location / {
        proxy_pass http://lbx:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-transform" always;
    }
}

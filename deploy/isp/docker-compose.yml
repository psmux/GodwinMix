# The quiz, its simulator, an RTMP server and the LiveboxMix mixer, on one
# internal network. Only loopback ports are published; the Cloudflare tunnel on
# the host is what reaches them from outside.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faithiq_user
      POSTGRES_PASSWORD: faithiq_password123
      POSTGRES_DB: bible_trivia_db
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faithiq_user -d bible_trivia_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  btq:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://faithiq_user:faithiq_password123@db:5432/bible_trivia_db
      SESSION_SECRET: "${SESSION_SECRET}"
      CLIENT_URL: https://quiz.spinber.com
      CORS_ORIGINS: https://quiz.spinber.com
      CHAMPIONSHIP_TIME_ZONE: Asia/Kolkata
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:5001:5001"

  simulator:
    build: ./simulator
    restart: unless-stopped
    depends_on:
      - btq
    environment:
      BTQ_BASE_URL: http://btq:5001
      BTQ_ADMIN_USER: admin
      BTQ_ADMIN_PASS: admin123
    # Around the clock: a match is always on, the championship URL never changes.
    # --end-live-matches: when this container restarts mid-match (a reboot, a
    # crash) the fixture it was playing stays "live" on the server with nobody
    # driving it, and the simulator refuses to touch a live fixture unless told
    # to. Here it is the only thing that ever plays, so ending its own leftover
    # is right.
    command: ["npm", "run", "play", "--", "--forever", "--allow-remote", "--end-live-matches", "--teams", "6", "--fixtures-per-round", "3", "--advance-delay", "20000"]

  # Test pages for the mixer (the three-video demo page), on the compose
  # network as http://www/.
  www:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./www:/usr/share/nginx/html:ro

  # Plain HLS of the programme, as files. mediamtx's own HLS gates each media
  # playlist behind a per-viewer session cookie set on a redirect, and through
  # Cloudflare and a proxy that cookie never came back: every media playlist
  # answered 401. ffmpeg pulls the programme over RTMP and writes an ordinary
  # playlist and MPEG-TS segments; nothing to negotiate, nothing per viewer.
  hls:
    image: linuxserver/ffmpeg:latest
    restart: unless-stopped
    depends_on:
      - mediamtx
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ffmpeg -loglevel warning -rw_timeout 10000000 -i rtmp://mediamtx:1935/live/program \
            -c copy -f hls -hls_time 2 -hls_list_size 6 \
            -hls_flags delete_segments+independent_segments+omit_endlist+temp_file \
            -hls_segment_filename /hls/program_%06d.ts /hls/program.m3u8
          rm -f /hls/program.m3u8 /hls/program_*.ts
          sleep 2
        done
    volumes:
      - hls:/hls

  # The public player for the programme: https://stream.spinber.com/
  player:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - hls
    volumes:
      - ./player/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./player/index.html:/usr/share/nginx/html/index.html:ro
      - ./player/hls-1.5.min.js:/usr/share/nginx/html/hls-1.5.min.js:ro
      - hls:/usr/share/nginx/html/hls:ro
    ports:
      - "127.0.0.1:8889:80"

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      # Plain fMP4 HLS, not low-latency: LL-HLS holds playlist requests open,
      # which a proxy in front (Cloudflare) does not carry well. Remux from
      # the moment the stream arrives, so the first viewer does not wait.
      MTX_HLSVARIANT: fmp4
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSSEGMENTDURATION: 2s
      MTX_HLSSEGMENTCOUNT: "7"
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8888:8888"

  lbx:
    build: ./lbx
    restart: unless-stopped
    depends_on:
      - mediamtx
      - btq
    shm_size: "1g"
    # The GPU, when the host has the NVIDIA driver and container toolkit. The
    # mixer's codec probe then finds nvh264enc and nvh264dec and uses them
    # (hardware.encode/decode = "auto" in liveboxmix.toml); on a host without
    # them the same image runs on x264 and avdec. "graphics" is what gives the
    # browsers EGL; "video" is NVENC and NVDEC.
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./lbx/config:/etc/liveboxmix
      - ./lbx/media:/var/lib/liveboxmix/media
    ports:
      - "127.0.0.1:8080:8080"   # the mixer: CEF whole page and superimpose
      - "127.0.0.1:8081:8081"   # the wpesrc mixer

volumes:
  dbdata:
  uploads:
  hls:

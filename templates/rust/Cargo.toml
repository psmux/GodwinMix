[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "{{description}}"
license = "{{license}}"
authors = ["{{author}}"]

# A plugin is its own crate with its own lockfile, even when it happens to sit
# inside the GodwinMix checkout. Without this line cargo would try to make it a
# member of the workspace above.
[workspace]

[dependencies]
# The SDK. `gmx plugin new` fills this in: a version once the crate is
# published, a path to the copy shipped beside the gmx binary until then.
godwinmix-sdk = {{sdk}}
serde_json = "1"

[features]
default = []
# Turn this on for the unixfd and shm transports, which are Linux and macOS
# only and need GStreamer. Add them to `transports` in gmx-plugin.toml too.
gst = ["godwinmix-sdk/gst"]

[profile.release]
# A plugin is a process the core starts. Small and quick to load matters more
# than the last percent of throughput, which is spent in the media loop anyway.
opt-level = 2
lto = "thin"
strip = true

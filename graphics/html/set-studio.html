<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D studio set</title>
<script type="application/json" id="gmx-template">
{
  "title": "3D studio set",
  "description": "Virtual set background with depth: a floor grid running away to the horizon, a large glowing ring turning slowly in 3D behind the presenter, and light columns on the back wall. Pair it with the set-studio-frame SVG in front. Built for the virtual-set layout.",
  "category": "set",
  "opaque": true,
  "fps": 20,
  "resolution": 0.5,
  "fields": {
    "station": {"label": "Name on the back wall", "default": "STUDIO ONE"},
    "accent":  {"label": "Light colour", "type": "color", "default": "#06b6d4"},
    "second":  {"label": "Second light colour", "type": "color", "default": "#a855f7"},
    "panel":   {"label": "Wall colour", "type": "color", "default": "#070b1a"},
    "text":    {"label": "Text colour", "type": "color", "default": "#ffffff"}
  }
}
</script>
<style>
  :root { --accent: #06b6d4; --second: #a855f7; --panel: #070b1a; --text: #ffffff; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text);
               font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif;
               background: radial-gradient(ellipse at 50% 38%, color-mix(in srgb, var(--second) 30%, var(--panel)) 0%, var(--panel) 60%, #000 100%); }
  .column { position: absolute; top: 0; width: 60px; height: 640px;
            background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent), transparent);
            opacity: .35; }
  .c1 { left: 180px; } .c2 { left: 420px; opacity: .2; } .c3 { right: 420px; opacity: .2; } .c4 { right: 180px; }
  .station { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 40px; font-weight: 800;
             letter-spacing: 18px; opacity: .55; }
  /* The ring: a circle turned in 3D, turning slowly about the upright. */
  .stage { position: absolute; left: 0; right: 0; top: 0; height: 1080px; perspective: 1400px; }
  .ring { position: absolute; left: 610px; top: 110px; width: 700px; height: 700px; border-radius: 50%;
          border: 14px solid var(--accent); box-shadow: 0 0 60px var(--accent), inset 0 0 60px var(--accent);
          transform: rotateY(28deg) rotateX(8deg); animation: turn 18s linear infinite paused; }
  .ring.two { left: 670px; top: 170px; width: 580px; height: 580px; border-width: 6px; border-color: var(--second);
              box-shadow: 0 0 40px var(--second); animation-duration: 27s; animation-direction: reverse; opacity: .8; }
  @keyframes turn { from { transform: rotateY(0deg) rotateX(8deg); } to { transform: rotateY(360deg) rotateX(8deg); } }
  /* The floor: a grid laid flat in 3D, sliding towards the camera and starting again. */
  .floor { position: absolute; left: -20%; right: -20%; top: 700px; height: 700px; transform-origin: 50% 0;
           transform: perspective(900px) rotateX(72deg); overflow: hidden; }
  .grid { position: absolute; inset: -200px 0 0 0;
          background-image: linear-gradient(color-mix(in srgb, var(--accent) 55%, transparent) 2px, transparent 2px),
                            linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent) 2px, transparent 2px);
          background-size: 100px 100px; animation: slide 6s linear infinite paused; }
  @keyframes slide { to { transform: translateY(100px); } }
  .fade { position: absolute; left: 0; right: 0; top: 690px; height: 140px; background: linear-gradient(180deg, var(--panel), transparent); }
  .gmx-in .ring, .gmx-in .grid { animation-play-state: running; }
</style>
</head>
<body>
  <div class="column c1"></div><div class="column c2"></div><div class="column c3"></div><div class="column c4"></div>
  <div class="station" data-field="station">STUDIO ONE</div>
  <div class="floor"><div class="grid"></div></div>
  <div class="fade"></div>
  <div class="stage"><div class="ring"></div><div class="ring two"></div></div>
</body>
</html>

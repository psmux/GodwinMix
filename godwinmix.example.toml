# Merged by `gmx preset apply classroom`. The file as it was before is in godwinmix.example.toml.bak.
# Comments from your own file are in that copy: this one is rewritten from
# the values, which is the price of merging two configurations.

[browser]

[canvas]
channels = 2
fps = 30
height = 1080
sample_rate = 48000
width = 1920

[control]
bind = "0.0.0.0:8080"

[hardware]
decode = "auto"
encode = "auto"
graphics = "auto"

[media]
dir = "media"

[multiview]
enabled = true
fps = 8
height = 540
include_program = true
jpeg_quality = 60
linger_secs = 2
width = 960

[[outputs]]
id = "primary"
policy = "own"
queue_secs = 5.0
uri = "rtmp://127.0.0.1:1935/live/program"

[[outputs]]
id = "recording"
policy = "own"
queue_secs = 2.0
type = "rtmp/output"
uri = "rtmp://127.0.0.1:1935/record/lesson"

[[outputs]]
id = "stream"
policy = "own"
queue_secs = 4.0
type = "rtmp/output"
uri = "rtmp://127.0.0.1:1935/live/lesson"

[program]
audio_bitrate_kbps = 160
audio_ramp_ms = 180
keyframe_interval_secs = 2
video_bitrate_kbps = 6000

[safety]
flash_guard = true
max_takes_per_minute = 120
min_hold_ms = 0

[safety.on_operator_silence]
action = "alert"
after_secs = 120

[security]
allow_exec_sources = false

[snapshot]
default_width = 320
enabled = true
idle_secs = 15
max_width = 1280
min_interval_secs = 5

[[sources]]
id = "cam1"
name = "Camera 1"
rtmp_client = "auto"
stall_timeout_secs = 2.0
superimpose = "off"
uri = "rtmp://127.0.0.1:1935/live/cam1"

[[sources]]
id = "cam2"
name = "Camera 2"
uri = "rtmp://127.0.0.1:1935/live/cam2"

[[sources]]
id = "teacher"
name = "Teacher"
type = "test/source"
uri = "test://smpte"

[sources.params]
uri = "test://smpte"

[[sources]]
id = "screen"
name = "Screen"
type = "test/source"
uri = "test://snow"

[sources.params]
uri = "test://snow"

[[sources]]
id = "slides"
name = "Slides"
type = "file/source"
uri = "media/lesson.mp4"

[sources.params]
uri = "media/lesson.mp4"

[stall]
